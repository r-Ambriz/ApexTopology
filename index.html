    <script>
// Template Engine - Lightweight Handlebars-style renderer
class TemplateEngine {
  render(template, context) {
    let result = template;
    result = this._processEach(result, context);
    result = this._processIf(result, context);
    result = this._processVariables(result, context);
    return result;
  }

  _processEach(template, context) {
    const eachRegex = /{{#each\s+(\w+)}}([\s\S]*?){{\/each}}/g;
    return template.replace(eachRegex, (match, arrayName, block) => {
      const array = this._getValue(context, arrayName);
      if (!Array.isArray(array) || array.length === 0) return '';
      return array.map((item, index) => {
        const itemContext = { ...context, this: item, '@index': index };
        return this.render(block, itemContext);
      }).join('');
    });
  }

  _processIf(template, context) {
    const ifRegex = /{{#if\s+(\w+)}}([\s\S]*?){{\/if}}/g;
    return template.replace(ifRegex, (match, condition, block) => {
      const value = this._getValue(context, condition);
      return this._isTruthy(value) ? this.render(block, context) : '';
    });
  }

  _processVariables(template, context) {
    const varRegex = /{{([^#/][^}]*)}}/g;
    return template.replace(varRegex, (match, path) => {
      const value = this._getValue(context, path.trim());
      return value !== undefined && value !== null ? String(value) : '';
    });
  }

  _getValue(context, path) {
    if (path === 'this') return context.this || context;
    const parts = path.split('.');
    let current = context;
    for (const part of parts) {
      if (current === undefined || current === null) return undefined;
      current = current[part];
    }
    return current;
  }

  _isTruthy(value) {
    if (value === undefined || value === null || value === false) return false;
    if (Array.isArray(value)) return value.length > 0;
    if (typeof value === 'string') return value.trim().length > 0;
    return Boolean(value);
  }
}
    </script>

    <script>
// Config Generator - Template-based SR OS config generator
class ConfigGenerator {
  constructor(hardwareDB) {
    this.hardwareDB = hardwareDB;
    this.engine = new TemplateEngine();
  }

  generateAll(input) {
    const files = [];
    const { global, nodes, links } = input;

    // Generate individual node configs
    nodes.forEach((node, index) => {
      const config = this.generateNodeConfig(node, index, global, nodes, links);
      files.push({ name: `${node.name}.sros.cfg`, code: config });
    });

    // Generate ContainerLab topology
    const clabConfig = this.generateContainerLabConfig(global, nodes, links);
    files.push({ name: 'clab.yml', code: clabConfig });

    return files;
  }

  generateNodeConfig(node, nodeIndex, global, allNodes, links) {
    const sections = [];
    const systemIP = this._generateSystemIP(global.ipPool, nodeIndex);
    
    // Base config
    sections.push(`# TiMOS-B-${global.srosVersion} ${node.nodeType} ${node.name}
# Generated by ApexTopology v0.3
# Topology: ${global.labName}

configure
    system
        name "${node.name}"
        location "${global.labName}"
        security
            user-params
                local-user
                    user "admin"
                        password "$2y$10$TQrZlpBDra86.qoexZUzQe"
                        access console ftp snmp netconf grpc
                        console
                            member ["administrative"]
                        exit
                    exit
                exit
            exit
        exit
    exit`);

    // System interface
    sections.push(`    router Base
        interface "system"
            address ${systemIP}/32
            loopback
            no shutdown
        exit
    exit`);

    // P2P Interfaces
    const nodeLinks = this._getNodeLinks(node.name, links);
    nodeLinks.forEach((link, idx) => {
      const interfaceConfig = this._renderP2PInterface(link, node.name, global.ipPool, nodeIndex, idx);
      sections.push(interfaceConfig);
    });

    // IGP
    if (node.igp === 'OSPF' && nodeLinks.length > 0) {
      const ospfIfaces = nodeLinks.map(l => 
        `                interface "${l.nodeA === node.name ? l.ifaceA : l.ifaceB}"
                    interface-type point-to-point
                    no shutdown
                exit`
      ).join('\n');
      
      sections.push(`    router Base
        ospf 0
            area 0.0.0.0
                interface "system"
                    no shutdown
                exit
${ospfIfaces}
            exit
            no shutdown
        exit
    exit`);
    } else if (node.igp === 'ISIS' && nodeLinks.length > 0) {
      const isisIfaces = nodeLinks.map(l => 
        `            interface "${l.nodeA === node.name ? l.ifaceA : l.ifaceB}"
                interface-type point-to-point
                level-capability level-2
                no shutdown
            exit`
      ).join('\n');
      
      sections.push(`    router Base
        isis 0
            area-id 49.0001
            level-capability level-2
            interface "system"
                ipv4-node-sid
                    index ${nodeIndex + 1}
                exit
                no shutdown
            exit
${isisIfaces}
            no shutdown
        exit
    exit`);
    }

    // MPLS/LDP
    if (node.mpls && node.mpls.includes('LDP') && nodeLinks.length > 0) {
      const ldpIfaces = nodeLinks.map(l => 
        `                interface "${l.nodeA === node.name ? l.ifaceA : l.ifaceB}"
                    ipv4
                        no shutdown
                    exit
                exit`
      ).join('\n');
      
      sections.push(`    router Base
        ldp
            interface-parameters
${ldpIfaces}
            exit
            no shutdown
        exit
    exit`);
    }

    // BGP
    const asNumber = global.asNumber || 65000;
    if (node.bgpRole === 'IBGP Route Reflector') {
      const rrClients = allNodes
        .filter(n => n.bgpRole === 'IBGP Peer' && n.name !== node.name)
        .map((n, idx) => {
          const peerIP = this._generateSystemIP(global.ipPool, allNodes.indexOf(n));
          return `                neighbor ${peerIP}
                    description "${n.name}"
                exit`;
        }).join('\n');
      
      sections.push(`    router Base
        autonomous-system ${asNumber}
        bgp
            router-id ${systemIP}
            group "RR-CLIENTS"
                family vpn-ipv4 vpn-ipv6
                cluster
                    cluster-id ${systemIP}
                exit
${rrClients}
            exit
            no shutdown
        exit
    exit`);
    } else if (node.bgpRole === 'IBGP Peer') {
      const ibgpPeers = allNodes
        .filter(n => n.bgpRole === 'IBGP Route Reflector')
        .map((n) => {
          const peerIP = this._generateSystemIP(global.ipPool, allNodes.indexOf(n));
          return `                neighbor ${peerIP}
                    description "${n.name}"
                exit`;
        }).join('\n');
      
      sections.push(`    router Base
        autonomous-system ${asNumber}
        bgp
            router-id ${systemIP}
            group "IBGP"
                family vpn-ipv4 vpn-ipv6
${ibgpPeers}
            exit
            no shutdown
        exit
    exit`);
    }

    // Services
    if (node.service === 'VPRN') {
      const serviceId = 100 + nodeIndex;
      sections.push(`    service
        vprn ${serviceId} customer 1 create
            description "VPRN Service ${serviceId}"
            autonomous-system ${asNumber}
            route-distinguisher ${systemIP}:${serviceId}
            vrf-target target:${asNumber}:${serviceId}
            interface "customer-1" create
                ipv4
                    primary
                        address 192.168.${nodeIndex}.1
                        prefix-length 24
                    exit
                exit
                sap 1/1/1:100 create
                exit
            exit
            no shutdown
        exit
    exit`);
    }

    sections.push('exit all');
    return sections.filter(s => s).join('\n\n');
  }

  _renderP2PInterface(link, nodeName, ipPool, nodeIndex, linkIndex) {
    const isNodeA = link.nodeA === nodeName;
    const interfaceName = isNodeA ? link.ifaceA : link.ifaceB;
    const portId = this._interfaceNameToPort(interfaceName);
    const { ipA, ipB, prefixLength } = this._generateLinkIPs(ipPool, nodeIndex, linkIndex);
    const ipAddress = isNodeA ? ipA : ipB;

    return `    port ${portId}
        ethernet
            mode network
            encap-type dot1q
        exit
        no shutdown
    exit
    router Base
        interface "${interfaceName}"
            port ${portId}:0
            ipv4
                primary
                    address ${ipAddress}
                    prefix-length ${prefixLength}
                exit
            exit
            no shutdown
        exit
    exit`;
  }

  generateContainerLabConfig(global, nodes, links) {
    const nodeSection = nodes.map(node => 
      `    ${node.name}:
      kind: nokia_sros
      type: ${node.nodeType.toLowerCase()}
      image: vrnetlab/nokia_sros:${global.srosVersion}
      startup-config: ${node.name}.sros.cfg`
    ).join('\n');

    const linkSection = links
      .filter(link => link.nodeA && link.nodeB && link.ifaceA && link.ifaceB)
      .map(link => `    - endpoints: ["${link.nodeA}:${link.ifaceA}", "${link.nodeB}:${link.ifaceB}"]`)
      .join('\n');

    return `name: ${global.labName}

topology:
  nodes:
${nodeSection}

  links:
${linkSection}`;
  }

  _interfaceNameToPort(interfaceName) {
    const match = interfaceName.match(/\d+\/\d+\/\d+/);
    return match ? match[0] : '1/1/1';
  }

  _generateSystemIP(ipPool, index) {
    const baseIP = ipPool.split('/')[0].split('.').map(Number);
    baseIP[3] = index + 1;
    return baseIP.join('.');
  }

  _generateLinkIPs(ipPool, nodeIndex, linkIndex) {
    const baseIP = ipPool.split('/')[0].split('.').map(Number);
    const subnet = 100 + (nodeIndex * 10) + linkIndex;
    return {
      ipA: `${baseIP[0]}.${baseIP[1]}.${subnet}.1`,
      ipB: `${baseIP[0]}.${baseIP[1]}.${subnet}.2`,
      prefixLength: 30,
    };
  }

  _getNodeLinks(nodeName, allLinks) {
    return allLinks.filter(link => link.nodeA === nodeName || link.nodeB === nodeName);
  }
}
    </script>

    <script type="text/babel">
const { useState, useRef } = React;

// Styles
const G = {
  bg: "#1e1e1e", panel: "#252526", card: "#2d2d30", border: "#3e3e42",
  accent: "#007acc", accent2: "#4ec9b0", accent3: "#ce9178",
  textPrimary: "#cccccc", textSecondary: "#9cdcfe", textMuted: "#6a6a6a",
  success: "#4ec9b0", warning: "#dcdcaa", error: "#f48771",
};

const css = `
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Segoe+UI:wght@300;400;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:${G.bg};color:${G.textPrimary};font-family:'Segoe UI',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:${G.panel};}
  ::-webkit-scrollbar-thumb{background:${G.border};border-radius:4px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
`;

const NODE_TYPES = ["7750SR", "7250IXR", "7950XRS", "7210SAS", "VSR", "Linux"];
const IGP_OPTIONS = ["OSPF", "ISIS", "None"];
const BGP_ROLES = ["IBGP Route Reflector", "IBGP Peer", "EBGP Peer", "None"];
const SERVICE_TYPES = ["VPRN", "L3VPN", "VPLS", "None"];

// Hardware DB - Embedded minimal version
const HARDWARE_DB = {
  "source": {
    "title": "SR-SIM Installation, Setup, and Deployment Guide",
    "release": "25.10.R1"
  },
  "chassis": {
    "IXR-6": {
      "sfmCpmTypes": ["None", "cpm-ixr", "sfm-ixr-6"],
      "iomCardTypes": ["None", "imm36-100g-qsfp28", "imm48-sfp+2-qsfp28"],
      "mdaTypes": ["None", "m36-100g-qsfp28", "m48-sfp+2-qsfp28"]
    },
    "7750SR-12": {
      "sfmCpmTypes": ["None", "cpm5"],
      "iomCardTypes": ["None", "iom3-xp-c"],
      "mdaTypes": ["None", "m10-1gb-sfp+"]
    },
    "7950XRS-20": {
      "sfmCpmTypes": ["None", "cpm-xrs"],
      "iomCardTypes": ["None", "iom-xrs-20e"],
      "mdaTypes": ["None", "m20-1gb-xp-sfp"]
    }
  }
};

// Components
const Btn = ({ onClick, children, disabled, variant = "default", style = {} }) => (
  <button onClick={onClick} disabled={disabled} style={{
    padding: "6px 14px", borderRadius: 6, border: "none", cursor: disabled ? "default" : "pointer",
    fontFamily: "'JetBrains Mono',monospace", fontSize: 11, letterSpacing: 1,
    background: variant === "success" ? G.success : variant === "primary" ? G.accent : G.card,
    color: variant === "default" ? G.textSecondary : G.bg,
    opacity: disabled ? .5 : 1, transition: "all .2s", ...style
  }}>
    {children}
  </button>
);

const Input = ({ value, onChange, placeholder = "", mono = false }) => (
  <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={{
    background: G.panel, border: `1px solid ${G.border}`, borderRadius: 6, padding: "8px 12px",
    color: G.textPrimary, fontSize: 12, fontFamily: mono ? "'JetBrains Mono',monospace" : "'Segoe UI',sans-serif",
    outline: "none", width: "100%"
  }} />
);

const Select = ({ value, onChange, options }) => (
  <select value={value} onChange={e => onChange(e.target.value)} style={{
    background: G.panel, border: `1px solid ${G.border}`, borderRadius: 6, padding: "8px 12px",
    color: G.textPrimary, fontSize: 12, fontFamily: "'JetBrains Mono',monospace", outline: "none", width: "100%"
  }}>
    {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
  </select>
);

const Label = ({ children }) => (
  <div style={{ fontSize: 11, color: G.textMuted, marginBottom: 6, letterSpacing: 1, fontFamily: "'JetBrains Mono',monospace" }}>
    {children}
  </div>
);

const Badge = ({ children, color = G.accent }) => (
  <div style={{ display: "inline-block", padding: "4px 10px", background: color + "22", color, borderRadius: 4, fontSize: 10, fontFamily: "'JetBrains Mono',monospace", letterSpacing: 1.5 }}>
    {children}
  </div>
);

const CodeBlock = ({ filename, code }) => {
  const copy = () => { navigator.clipboard.writeText(code); };
  return (
    <div style={{ marginBottom: 16, background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, overflow: "hidden" }}>
      <div style={{ background: G.panel, padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${G.border}` }}>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: G.accent }}>{filename}</div>
        <Btn onClick={copy}>COPY</Btn>
      </div>
      <pre style={{ padding: 16, margin: 0, overflowX: "auto", fontFamily: "'JetBrains Mono',monospace", fontSize: 11, lineHeight: 1.6, color: G.textSecondary, maxHeight: 500 }}>
        {code}
      </pre>
    </div>
  );
};

// Node Editor
const NodeEditor = ({ node, index, onChange, onDelete }) => (
  <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 16, marginBottom: 12 }}>
    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
      <div style={{ fontSize: 14, fontWeight: 600, color: G.accent, fontFamily: "'JetBrains Mono',monospace" }}>
        NODE {index + 1}
      </div>
      <div style={{ flex: 1 }} />
      <Btn onClick={onDelete} variant="default">✕ DELETE</Btn>
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
      <div><Label>Name</Label><Input value={node.name} onChange={v => onChange({ ...node, name: v })} mono /></div>
      <div><Label>Type</Label><Select value={node.nodeType} onChange={v => onChange({ ...node, nodeType: v })} options={NODE_TYPES} /></div>
      <div><Label>IGP</Label><Select value={node.igp} onChange={v => onChange({ ...node, igp: v })} options={IGP_OPTIONS} /></div>
      <div><Label>BGP Role</Label><Select value={node.bgpRole} onChange={v => onChange({ ...node, bgpRole: v })} options={BGP_ROLES} /></div>
      <div><Label>Service</Label><Select value={node.service} onChange={v => onChange({ ...node, service: v })} options={SERVICE_TYPES} /></div>
      <div><Label>MPLS</Label><Input value={node.mpls || ""} onChange={v => onChange({ ...node, mpls: v })} placeholder="LDP,RSVP" mono /></div>
    </div>
  </div>
);

// Link Editor
const LinkEditor = ({ link, nodes, onChange, onDelete }) => (
  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr auto", gap: 8, marginBottom: 8, alignItems: "center" }}>
    <Select value={link.nodeA} onChange={v => onChange({ ...link, nodeA: v })} options={["", ...nodes.map(n => n.name)]} />
    <Input value={link.ifaceA} onChange={v => onChange({ ...link, ifaceA: v })} placeholder="1/1/1" mono />
    <Select value={link.nodeB} onChange={v => onChange({ ...link, nodeB: v })} options={["", ...nodes.map(n => n.name)]} />
    <Input value={link.ifaceB} onChange={v => onChange({ ...link, ifaceB: v })} placeholder="1/1/1" mono />
    <Select value={link.type} onChange={v => onChange({ ...link, type: v })} options={["Link", "LAG", "None"]} />
    <Btn onClick={onDelete}>✕</Btn>
  </div>
);

// Default values
const defaultNode = (id) => ({
  id, name: `R${id}`, nodeType: "7750SR", igp: "ISIS",
  bgpRole: "None", service: "None", mpls: "LDP"
});

const defaultLink = (id) => ({
  id, nodeA: "", nodeB: "", ifaceA: "", ifaceB: "", type: "Link"
});

// Main App
function App() {
  const [tab, setTab] = useState("topology");
  const [nodes, setNodes] = useState([defaultNode(1), defaultNode(2)]);
  const [links, setLinks] = useState([defaultLink(1)]);
  const [global, setGlobal] = useState({ labName: "nokia-lab", srosVersion: "25.10.R3", ipPool: "10.0.0.0/8", asNumber: 65000 });
  const [loading, setLoading] = useState(false);
  const [output, setOutput] = useState(null);
  const [error, setError] = useState(null);
  const nodeId = useRef(3);
  const linkId = useRef(2);

  const addNode = () => { setNodes(p => [...p, defaultNode(nodeId.current++)]); };
  const delNode = (i) => setNodes(p => p.filter((_, j) => j !== i));
  const updNode = (i, n) => setNodes(p => p.map((x, j) => j === i ? n : x));
  const addLink = () => { setLinks(p => [...p, defaultLink(linkId.current++)]); };
  const delLink = (i) => setLinks(p => p.filter((_, j) => j !== i));
  const updLink = (i, l) => setLinks(p => p.map((x, j) => j === i ? l : x));

  const generate = () => {
    if (nodes.length === 0) return;
    setLoading(true);
    setError(null);
    setOutput(null);
    setTab("output");

    setTimeout(() => {
      try {
        const generator = new ConfigGenerator(HARDWARE_DB);
        const files = generator.generateAll({ global, nodes, links });
        setOutput({ files });
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    }, 300);
  };

  const downloadAll = () => {
    if (!output) return;
    output.files.forEach(f => {
      const blob = new Blob([f.code], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = f.name; a.click();
      URL.revokeObjectURL(url);
    });
  };

  const TABS = [
    { id: "topology", label: "NODES", icon: "◈", count: nodes.length },
    { id: "links", label: "LINKS", icon: "⟷", count: links.filter(l => l.nodeA && l.nodeB).length },
    { id: "global", label: "GLOBAL", icon: "⚙", count: null },
    { id: "output", label: "OUTPUT", icon: "◉", count: output ? output.files.length : null },
  ];

  return (
    <div style={{ minHeight: "100vh", background: G.bg, display: "flex", flexDirection: "column" }}>
      <style>{css}</style>
      
      {/* Header */}
      <div style={{ background: G.panel, borderBottom: `1px solid ${G.border}`, padding: "14px 24px", display: "flex", alignItems: "center", gap: 16 }}>
        <div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 20, fontWeight: 700, color: G.accent, letterSpacing: 2 }}>
            ApexTopology
          </div>
          <div style={{ fontSize: 10, color: G.textMuted, letterSpacing: 2, fontFamily: "'JetBrains Mono',monospace" }}>
            Nokia SR OS Config Generator v0.3 · Template-Based
          </div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 10 }}>
          <Badge color={G.accent}>ContainerLAB</Badge>
          <Badge color={G.success}>Template Engine</Badge>
          <Btn onClick={generate} disabled={loading || nodes.length === 0} variant="success" style={{ padding: "8px 20px" }}>
            {loading ? "GENERATING..." : "▶ GENERATE CONFIGS"}
          </Btn>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ background: G.panel, borderBottom: `1px solid ${G.border}`, display: "flex", gap: 2, padding: "0 24px" }}>
        {TABS.map(t => (
          <div key={t.id} onClick={() => setTab(t.id)} style={{
            padding: "12px 20px", cursor: "pointer", fontSize: 12, fontFamily: "'JetBrains Mono',monospace",
            letterSpacing: 1.5, color: tab === t.id ? G.accent : G.textSecondary,
            borderBottom: tab === t.id ? `2px solid ${G.accent}` : "2px solid transparent",
            transition: "all .2s", display: "flex", alignItems: "center", gap: 8
          }}>
            <span>{t.icon}</span>
            {t.label}
            {t.count !== null && <Badge color={tab === t.id ? G.accent : G.textMuted}>{t.count}</Badge>}
          </div>
        ))}
      </div>

      {/* Content */}
      <div style={{ flex: 1, padding: 24, overflowY: "auto" }}>
        {tab === "topology" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600 }}>Node Configuration</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Define routers in your topology</div>
              </div>
              <Btn onClick={addNode} variant="primary">+ ADD NODE</Btn>
            </div>
            {nodes.length === 0 && (
              <div style={{ textAlign: "center", padding: "60px 0", color: G.textMuted }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>◈</div>
                <div>No nodes. Add one to start.</div>
              </div>
            )}
            {nodes.map((n, i) => (
              <NodeEditor key={n.id} node={n} index={i} onChange={v => updNode(i, v)} onDelete={() => delNode(i)} />
            ))}
          </div>
        )}

        {tab === "links" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600 }}>Links / Connections</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Define connections between nodes</div>
              </div>
              <Btn onClick={addLink} variant="primary">+ ADD LINK</Btn>
            </div>
            <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 16 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr auto", gap: 8, marginBottom: 10 }}>
                {["Node A", "Iface A", "Node B", "Iface B", "Type", ""].map((h, i) => (
                  <div key={i} style={{ fontSize: 10, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>{h}</div>
                ))}
              </div>
              {links.length === 0 && (
                <div style={{ textAlign: "center", padding: "30px 0", color: G.textMuted }}>No links defined.</div>
              )}
              {links.map((l, i) => (
                <LinkEditor key={l.id} link={l} nodes={nodes} onChange={v => updLink(i, v)} onDelete={() => delLink(i)} />
              ))}
            </div>
          </div>
        )}

        {tab === "global" && (
          <div style={{ animation: "fadeIn .2s ease", maxWidth: 640 }}>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 600 }}>Global Parameters</div>
              <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Lab-wide configuration</div>
            </div>
            <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 20, display: "grid", gap: 16 }}>
              <div><Label>Lab Name</Label><Input value={global.labName} onChange={v => setGlobal(p => ({ ...p, labName: v }))} /></div>
              <div><Label>SR OS Version</Label>
                <Select value={global.srosVersion} onChange={v => setGlobal(p => ({ ...p, srosVersion: v }))} 
                  options={["23.3.R2", "23.7.R1", "24.3.R2", "24.10.R1", "25.3.R1", "25.10.R3"]} />
              </div>
              <div><Label>IP Pool</Label><Input value={global.ipPool} onChange={v => setGlobal(p => ({ ...p, ipPool: v }))} mono /></div>
              <div><Label>AS Number</Label><Input value={global.asNumber} onChange={v => setGlobal(p => ({ ...p, asNumber: parseInt(v) || 65000 }))} mono /></div>
            </div>
          </div>
        )}

        {tab === "output" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600 }}>Generated Files</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>
                  {loading ? "Generating..." : output ? `${output.files.length} files ready` : "Press GENERATE to start"}
                </div>
              </div>
              {output && <Btn onClick={downloadAll} variant="success">↓ DOWNLOAD ALL</Btn>}
            </div>

            {loading && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20, padding: "60px 0" }}>
                <div style={{ width: 60, height: 60, border: `3px solid ${G.border}`, borderTopColor: G.accent, borderRadius: "50%", animation: "spin .9s linear infinite" }} />
                <div style={{ fontFamily: "'JetBrains Mono',monospace", color: G.accent, fontSize: 13 }}>Generating configs...</div>
              </div>
            )}

            {error && (
              <div style={{ background: G.error + "11", border: `1px solid ${G.error}44`, borderRadius: 10, padding: 20 }}>
                <div style={{ color: G.error, fontWeight: 600 }}>Generation Error</div>
                <div style={{ color: G.textSecondary, fontSize: 13, marginTop: 4 }}>{error}</div>
              </div>
            )}

            {output && !loading && (
              <div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                  {output.files.map(f => (
                    <Badge key={f.name} color={f.name.includes("clab") ? G.accent3 : G.accent}>{f.name}</Badge>
                  ))}
                </div>
                {output.files.map(f => (
                  <CodeBlock key={f.name} filename={f.name} code={f.code} />
                ))}
              </div>
            )}

            {!loading && !output && !error && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, padding: "60px 0", color: G.textMuted }}>
                <div style={{ fontSize: 48 }}>◉</div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 13 }}>Configure nodes and press GENERATE</div>
                <div style={{ fontSize: 11, maxWidth: 400, textAlign: "center" }}>
                  Template-based generator produces deterministic, production-ready SR OS configs
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ background: G.panel, borderTop: `1px solid ${G.border}`, padding: "8px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 11, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>
          ApexTopology v0.3 · Template Engine · No AI Required
        </span>
        <span style={{ fontSize: 11, color: G.success, fontFamily: "'JetBrains Mono',monospace" }}>✓ DETERMINISTIC</span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
