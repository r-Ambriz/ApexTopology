<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexTopology - Nokia SR OS Configuration Generator</title>
  <meta name="description" content="AI-Powered Nokia SR OS Configuration Generator for ContainerLab">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80' fill='%23007acc'>◈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #1e1e1e; color: #d4d4d4; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e1e1e; }
    ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#1e1e1e;color:#007acc;font-family:'JetBrains Mono',monospace;font-size:14px">Loading ApexTopology...</div></div>
  <script type="text/babel" data-presets="react">
const { useState, useCallback, useRef, useEffect } = React;

const G = {
  bg:'#1e1e1e',bg2:'#252526',bg3:'#2d2d30',bg4:'#333333',
  border:'#3e3e42',accent:'#007acc',accent2:'#569cd6',accent3:'#4ec9b0',
  green:'#4caf50',yellow:'#dcdcaa',orange:'#ce9178',red:'#f44747',purple:'#c586c0',
  text:'#d4d4d4',textMuted:'#858585',textDim:'#6a6a6a',
};
const css = {
  input:{background:G.bg,border:`1px solid ${G.border}`,borderRadius:3,color:G.text,fontFamily:"'JetBrains Mono',monospace",fontSize:12,padding:'5px 8px',width:'100%',outline:'none'},
  label:{fontSize:10,color:G.textMuted,fontFamily:"'JetBrains Mono',monospace",letterSpacing:1,textTransform:'uppercase',marginBottom:4,display:'block'},
  btn:{background:G.accent,border:'none',borderRadius:3,color:'#fff',cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:600,padding:'6px 14px',letterSpacing:0.5},
  card:{background:G.bg2,border:`1px solid ${G.border}`,borderRadius:4,padding:16},
};
function uid(){return Math.random().toString(36).slice(2,8);}
function Label({children}){return <span style={css.label}>{children}</span>;}
function Input({label,value,onChange,placeholder,type='text',style={}}){
  return(<div>{label&&<Label>{label}</Label>}<input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)} style={{...css.input,...style}}/></div>);
}
function Select({label,value,onChange,options}){
  return(<div>{label&&<Label>{label}</Label>}<select value={value} onChange={e=>onChange(e.target.value)} style={{...css.input,cursor:'pointer'}}>{options.map(o=>typeof o==='object'?<option key={o.value} value={o.value}>{o.label}</option>:<option key={o} value={o}>{o}</option>)}</select></div>);
}
function Badge({color=G.accent,children}){
  return <span style={{background:color+'33',color,border:`1px solid ${color}88`,borderRadius:2,padding:'2px 8px',fontSize:11,fontFamily:"'JetBrains Mono',monospace",fontWeight:500,letterSpacing:0.5}}>{children}</span>;
}
function Button({onClick,children,color=G.accent,outline=false,small=false,style={}}){
  const[hover,setHover]=useState(false);
  return(<button onClick={onClick} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{...css.btn,background:outline?(hover?color+'22':'transparent'):(hover?color+'cc':color),border:outline?`1px solid ${color}`:'none',color:outline?color:'#fff',padding:small?'4px 10px':'6px 14px',fontSize:small?11:12,transition:'all 0.15s',...style}}>{children}</button>);
}
const NODE_TYPES=['7750 SR-1','7750 SR-7','7750 SR-12','7750 SR-14s','7450 ESS-7','7210 SAS-M','7210 SAS-T','7710 SR-c4','7710 SR-c12','vRR','vSR','SR-1e','SR-2e','SR-7s','SR-14s'];
const DEFAULT_NODE=()=>({id:uid(),name:'',type:'7750 SR-7',mgmtIp:'',loopback:'',asn:'',role:'PE',group:'core',systemIp:''});
function NodeForm({node,onChange,onDelete}){
  const field=(key)=>(val)=>onChange({...node,[key]:val});
  return(<div style={{...css.card,marginBottom:8}}>
    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
      <Badge color={G.accent3}>{node.role}</Badge>
      <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:G.accent,flex:1,fontWeight:700}}>{node.name||<span style={{color:G.textDim}}>unnamed node</span>}</span>
      <button onClick={onDelete} style={{background:'none',border:'none',color:G.red,cursor:'pointer',fontSize:16,padding:'0 4px'}}>✕</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(160px, 1fr))',gap:10}}>
      <Input label="Node Name" value={node.name} onChange={field('name')} placeholder="R1"/>
      <Select label="Platform" value={node.type} onChange={field('type')} options={NODE_TYPES}/>
      <Select label="Role" value={node.role} onChange={field('role')} options={['PE','P','RR','CE','ASBR','BNG','vRR']}/>
      <Input label="Group" value={node.group} onChange={field('group')} placeholder="core"/>
      <Input label="Mgmt IP/CIDR" value={node.mgmtIp} onChange={field('mgmtIp')} placeholder="172.20.20.10/24"/>
      <Input label="System / Loopback" value={node.loopback} onChange={field('loopback')} placeholder="192.168.1.1/32"/>
      <Input label="BGP ASN" value={node.asn} onChange={field('asn')} placeholder="64512"/>
    </div>
  </div>);
}
const DEFAULT_LINK=(nodes)=>({id:uid(),nodeA:nodes[0]?.name||'',portA:'1/1/1',nodeB:nodes[1]?.name||nodes[0]?.name||'',portB:'1/1/1',ipA:'',ipB:'',encap:'null',vlanId:'',metric:'10',bfd:false,mpls:true,description:''});
function LinkForm({link,nodes,onChange,onDelete}){
  const f=(key)=>(val)=>onChange({...link,[key]:val});
  const nodeOpts=nodes.map(n=>n.name).filter(Boolean);
  return(<div style={{...css.card,marginBottom:8}}>
    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
      <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:G.yellow,flex:1}}>{link.nodeA||'?'}/{link.portA} ↔ {link.nodeB||'?'}/{link.portB}</span>
      <button onClick={onDelete} style={{background:'none',border:'none',color:G.red,cursor:'pointer',fontSize:16,padding:'0 4px'}}>✕</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(150px, 1fr))',gap:10}}>
      <Select label="Node A" value={link.nodeA} onChange={f('nodeA')} options={nodeOpts}/>
      <Input label="Port A" value={link.portA} onChange={f('portA')} placeholder="1/1/1"/>
      <Input label="IP A /30 or /31" value={link.ipA} onChange={f('ipA')} placeholder="10.0.0.0/31"/>
      <Select label="Node B" value={link.nodeB} onChange={f('nodeB')} options={nodeOpts}/>
      <Input label="Port B" value={link.portB} onChange={f('portB')} placeholder="1/1/2"/>
      <Input label="IP B /30 or /31" value={link.ipB} onChange={f('ipB')} placeholder="10.0.0.1/31"/>
      <Select label="Encapsulation" value={link.encap} onChange={f('encap')} options={['null','dot1q','qinq','ppp']}/>
      {link.encap!=='null'&&<Input label="VLAN ID" value={link.vlanId} onChange={f('vlanId')} placeholder="100"/>}
      <Input label="IS-IS Metric" value={link.metric} onChange={f('metric')} placeholder="10"/>
      <Input label="Description" value={link.description} onChange={f('description')} placeholder="R1-R2 core link"/>
      <div style={{display:'flex',gap:16,alignItems:'center',paddingTop:18}}>
        <label style={{display:'flex',gap:6,alignItems:'center',cursor:'pointer',fontSize:12,color:G.text}}><input type="checkbox" checked={link.bfd} onChange={e=>f('bfd')(e.target.checked)}/>BFD</label>
        <label style={{display:'flex',gap:6,alignItems:'center',cursor:'pointer',fontSize:12,color:G.text}}><input type="checkbox" checked={link.mpls} onChange={e=>f('mpls')(e.target.checked)}/>MPLS</label>
      </div>
    </div>
  </div>);
}
function GlobalConfig({global,setGlobal}){
  const f=(key)=>(val)=>setGlobal(p=>({...p,[key]:val}));
  return(<div style={css.card}>
    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:G.accent,marginBottom:14,fontWeight:700,letterSpacing:1}}>GLOBAL SETTINGS</div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(170px, 1fr))',gap:12}}>
      <Input label="Lab Name" value={global.labName} onChange={f('labName')} placeholder="mpls-core-lab"/>
      <Select label="SR OS Version" value={global.srosVersion} onChange={f('srosVersion')} options={["23.3.R2","23.7.R1","23.10.R2","24.3.R2","24.7.R1","24.10.R1","25.3.R1","25.7.R1","25.10.R3"]}/>
      <Select label="IS-IS Level" value={global.isisLevel} onChange={f('isisLevel')} options={['level-1','level-2','level-1-2']}/>
      <Input label="IS-IS Area" value={global.isisArea} onChange={f('isisArea')} placeholder="49.0001"/>
      <Input label="BGP Router ID Base" value={global.bgpBase} onChange={f('bgpBase')} placeholder="192.168.0"/>
      <Select label="MPLS Protocol" value={global.mplsProto} onChange={f('mplsProto')} options={['LDP','RSVP-TE','SR-MPLS','SRv6']}/>
      <Select label="VPN Type" value={global.vpnType} onChange={f('vpnType')} options={['L3VPN','EVPN','VPLS','VLL','None']}/>
      <Select label="Mgmt Network" value={global.mgmtNet} onChange={f('mgmtNet')} options={['Management','OOB','In-band']}/>
      <Input label="DNS Domain" value={global.dnsDomain} onChange={f('dnsDomain')} placeholder="lab.nokia.net"/>
      <Input label="NTP Server" value={global.ntp} onChange={f('ntp')} placeholder="192.168.1.254"/>
      <div style={{display:'flex',gap:12,alignItems:'center',paddingTop:18}}>
        <label style={{display:'flex',gap:6,alignItems:'center',cursor:'pointer',fontSize:12,color:G.text}}><input type="checkbox" checked={global.bfd} onChange={e=>f('bfd')(e.target.checked)}/>Global BFD</label>
        <label style={{display:'flex',gap:6,alignItems:'center',cursor:'pointer',fontSize:12,color:G.text}}><input type="checkbox" checked={global.snmp} onChange={e=>f('snmp')(e.target.checked)}/>SNMP</label>
      </div>
    </div>
  </div>);
}
function buildSystemPrompt(global){
  return `You are an expert Nokia SR OS network engineer with deep knowledge of SR OS ${global.srosVersion} CLI syntax and ContainerLab.\n\nGenerate COMPLETE Nokia SR OS configuration files ready to paste. Rules:\n- Correct SR OS ${global.srosVersion} CLI hierarchy\n- Always include "no shutdown"\n- 4-space indentation\n- IS-IS ${global.isisLevel} area ${global.isisArea}\n- MPLS: ${global.mplsProto}\n- Lab: ${global.labName}, Domain: ${global.dnsDomain}\n${global.ntp?`- NTP: ${global.ntp}`:''}\n${global.snmp?'- SNMP v2c community "public" read-only':''}\n${global.bfd?'- Enable BFD globally':''}\n\nOutput ONLY raw configuration, no markdown, no backticks.`;
}
function buildUserPrompt(node,links,global){
  const myLinks=links.filter(l=>l.nodeA===node.name||l.nodeB===node.name);
  return `Generate complete SR OS config for:\nNODE: ${node.name}\nPlatform: ${node.type}\nRole: ${node.role}\nSystem IP: ${node.loopback||'not specified'}\nMgmt IP: ${node.mgmtIp||'not specified'}\nBGP ASN: ${node.asn||'not specified'}\nGroup: ${node.group}\n\nINTERFACES:\n${myLinks.map(l=>{const isA=l.nodeA===node.name;const peer=isA?l.nodeB:l.nodeA;const myPort=isA?l.portA:l.portB;const myIp=isA?l.ipA:l.ipB;const peerIp=isA?l.ipB:l.ipA;return `Port ${myPort} → ${peer} (peer ${peerIp||'N/A'})\n  My IP: ${myIp||'N/A'} | Encap: ${l.encap}${l.vlanId?` VLAN ${l.vlanId}`:''} | Metric: ${l.metric} | BFD: ${l.bfd?'yes':'no'} | MPLS: ${l.mpls?'yes':'no'}\n  Desc: ${l.description||'none'}`;}).join('\n\n')||'  No links'}\n\nVPN: ${global.vpnType} | BGP Base: ${global.bgpBase}\n\nGenerate full config now:`;
}
function OutputPanel({configs}){
  const[active,setActive]=useState(0);
  const[copied,setCopied]=useState(false);
  if(!configs.length)return null;
  const cfg=configs[active];
  const copy=()=>navigator.clipboard.writeText(cfg.config).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  const dl=()=>{const b=new Blob([cfg.config],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${cfg.name}.cfg`;a.click();};
  const dlAll=()=>configs.forEach(c=>setTimeout(()=>{const b=new Blob([c.config],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${c.name}.cfg`;a.click();},200));
  return(<div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div style={{display:'flex',gap:2,overflowX:'auto',background:G.bg3,borderBottom:`1px solid ${G.border}`,padding:'4px 8px 0',flexShrink:0}}>
      {configs.map((c,i)=><button key={c.name} onClick={()=>setActive(i)} style={{background:active===i?G.bg2:'transparent',border:'none',borderBottom:active===i?`2px solid ${G.accent}`:'2px solid transparent',color:active===i?G.accent:G.textMuted,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:11,padding:'6px 12px',whiteSpace:'nowrap'}}>{c.name}.cfg</button>)}
    </div>
    <div style={{display:'flex',gap:8,padding:'8px 12px',background:G.bg3,borderBottom:`1px solid ${G.border}`,flexShrink:0}}>
      <Button onClick={copy} small>{copied?'✓ Copied!':'⎘ Copy'}</Button>
      <Button onClick={dl} small outline>↓ Download .cfg</Button>
      {configs.length>1&&<Button onClick={dlAll} small outline>↓ All ({configs.length})</Button>}
      <span style={{flex:1}}/>
      <span style={{fontSize:11,color:G.textMuted,fontFamily:"'JetBrains Mono',monospace",alignSelf:'center'}}>{cfg.config.split('\n').length} lines</span>
    </div>
    <pre style={{flex:1,overflow:'auto',margin:0,padding:16,background:G.bg,color:G.text,fontFamily:"'JetBrains Mono',monospace",fontSize:12,lineHeight:1.6,whiteSpace:'pre',tabSize:4}}>{cfg.config}</pre>
  </div>);
}
const TABS=['NODES','LINKS','GLOBAL','OUTPUT'];
function App(){
  const[tab,setTab]=useState(0);
  const[nodes,setNodes]=useState([]);
  const[links,setLinks]=useState([]);
  const[global,setGlobal]=useState({labName:'mpls-core-lab',srosVersion:'25.10.R3',isisLevel:'level-2',isisArea:'49.0001',bgpBase:'192.168.0',mplsProto:'SR-MPLS',vpnType:'L3VPN',mgmtNet:'Management',dnsDomain:'lab.nokia.net',ntp:'',bfd:true,snmp:false});
  const[configs,setConfigs]=useState([]);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState('');
  const[progress,setProgress]=useState('');
  const addNode=()=>setNodes(n=>[...n,DEFAULT_NODE()]);
  const updateNode=(id,data)=>setNodes(n=>n.map(x=>x.id===id?data:x));
  const deleteNode=(id)=>setNodes(n=>n.filter(x=>x.id!==id));
  const addLink=()=>{if(nodes.length<2){setError('Add at least 2 nodes first.');return;}setLinks(l=>[...l,DEFAULT_LINK(nodes)]);setError('');};
  const updateLink=(id,data)=>setLinks(l=>l.map(x=>x.id===id?data:x));
  const deleteLink=(id)=>setLinks(l=>l.filter(x=>x.id!==id));
  const generate=async()=>{
    const valid=nodes.filter(n=>n.name.trim());
    if(!valid.length){setError('Add at least one named node.');return;}
    setLoading(true);setError('');setConfigs([]);
    const results=[];
    for(let i=0;i<valid.length;i++){
      const node=valid[i];
      setProgress(`Generating ${i+1}/${valid.length}: ${node.name}...`);
      try{
        const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4096,system:buildSystemPrompt(global),messages:[{role:'user',content:buildUserPrompt(node,links,global)}]})});
        const data=await res.json();
        results.push({name:node.name,config:data.content?.[0]?.text||`# Error for ${node.name}`});
      }catch(e){results.push({name:node.name,config:`# Error: ${e.message}`});}
    }
    setConfigs(results);setLoading(false);setProgress('');setTab(3);
  };
  return(<div style={{display:'flex',flexDirection:'column',height:'100vh',background:G.bg}}>
    <div style={{background:G.bg3,borderBottom:`1px solid ${G.border}`,padding:'10px 20px',display:'flex',alignItems:'center',gap:16,flexShrink:0}}>
      <div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:18,fontWeight:700,color:G.accent,letterSpacing:2,textShadow:`0 0 20px ${G.accent}88`}}>APEX<span style={{color:G.accent2}}>·</span>TOPOLOGY</div>
        <div style={{fontSize:10,color:G.textMuted,letterSpacing:3,fontFamily:"'JetBrains Mono',monospace"}}>Nokia SR OS {global.srosVersion} · Config Generator</div>
      </div>
      <div style={{flex:1}}/>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <Badge color={G.green}>{nodes.filter(n=>n.name).length} nodes</Badge>
        <Badge color={G.yellow}>{links.length} links</Badge>
        <Button onClick={generate} style={{background:loading?G.bg4:G.green,border:`1px solid ${G.green}`,color:loading?G.textMuted:'#fff'}}>{loading?progress||'Generating...':'▶ GENERATE CONFIGS'}</Button>
      </div>
    </div>
    {error&&<div style={{background:G.red+'22',border:`1px solid ${G.red}`,color:G.red,padding:'8px 20px',fontSize:12,fontFamily:"'JetBrains Mono',monospace"}}>⚠ {error}</div>}
    <div style={{display:'flex',background:G.bg3,borderBottom:`1px solid ${G.border}`}}>
      {TABS.map((t,i)=><button key={t} onClick={()=>setTab(i)} style={{background:tab===i?G.bg2:'transparent',border:'none',borderBottom:tab===i?`2px solid ${G.accent}`:'2px solid transparent',color:tab===i?G.accent:G.textMuted,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:tab===i?700:400,padding:'10px 20px',letterSpacing:0.5}}>{t}{t==='OUTPUT'&&configs.length?` (${configs.length})`:''}</button>)}
    </div>
    <div style={{flex:1,overflow:'hidden'}}>
      {tab===0&&<div style={{height:'100%',overflow:'auto',padding:16}}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14,gap:10}}><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:G.textMuted,flex:1}}>Define ContainerLAB nodes. Each node generates a separate .cfg file.</span><Button onClick={addNode}>+ Add Node</Button></div>
        {nodes.length===0&&<div style={{textAlign:'center',padding:60,color:G.textDim,fontFamily:"'JetBrains Mono',monospace",fontSize:13}}>No nodes yet.<br/><br/><Button onClick={addNode}>+ Add First Node</Button></div>}
        {nodes.map(n=><NodeForm key={n.id} node={n} onChange={d=>updateNode(n.id,d)} onDelete={()=>deleteNode(n.id)}/>)}
      </div>}
      {tab===1&&<div style={{height:'100%',overflow:'auto',padding:16}}>
        <div style={{display:'flex',alignItems:'center',marginBottom:14,gap:10}}><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:G.textMuted,flex:1}}>Define links between nodes.</span><Button onClick={addLink}>+ Add Link</Button></div>
        {links.length===0&&<div style={{textAlign:'center',padding:60,color:G.textDim,fontFamily:"'JetBrains Mono',monospace",fontSize:13}}>No links yet.{nodes.length<2&&' Add at least 2 nodes first.'}<br/><br/>{nodes.length>=2&&<Button onClick={addLink}>+ Add First Link</Button>}</div>}
        {links.map(l=><LinkForm key={l.id} link={l} nodes={nodes} onChange={d=>updateLink(l.id,d)} onDelete={()=>deleteLink(l.id)}/>)}
      </div>}
      {tab===2&&<div style={{height:'100%',overflow:'auto',padding:16}}><GlobalConfig global={global} setGlobal={setGlobal}/></div>}
      {tab===3&&<div style={{height:'100%',display:'flex',flexDirection:'column'}}>
        {loading&&<div style={{padding:40,textAlign:'center',fontFamily:"'JetBrains Mono',monospace",color:G.accent,fontSize:13}}><div style={{marginBottom:16,fontSize:24}}>⚙</div>{progress||'Generating...'}</div>}
        {!loading&&configs.length===0&&<div style={{padding:60,textAlign:'center',color:G.textDim,fontFamily:"'JetBrains Mono',monospace",fontSize:13}}>No configs yet.<br/><br/><Button onClick={()=>setTab(0)}>← Go to Nodes</Button></div>}
        {!loading&&configs.length>0&&<OutputPanel configs={configs}/>}
      </div>}
    </div>
    <div style={{background:G.bg3,borderTop:`1px solid ${G.border}`,padding:'6px 20px',display:'flex',justifyContent:'space-between',flexShrink:0}}>
      <span style={{fontSize:11,color:G.textMuted,fontFamily:"'JetBrains Mono',monospace"}}>ApexTopology v0.2 · Nokia SR OS {global.srosVersion} · AI-Powered Config Generator</span>
      <span style={{fontSize:11,color:G.textDim,fontFamily:"'JetBrains Mono',monospace"}}>ContainerLAB · TAC Lab Tool</span>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
