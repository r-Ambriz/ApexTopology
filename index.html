const SFM_CPM_TYPES = HARDWARE_DB.sfmCpmTypes;
const IOM_TYPES = HARDWARE_DB.iomCardTypes;
const MDA_TYPES = HARDWARE_DB.mdaTypes;
const PLATFORM_CHASSIS_MATCHERS = {
  "7250IXR": chassis => chassis.startsWith("IXR-"),
  "7450ESS": chassis => chassis.startsWith("ESS-"),
  "7705SAR": chassis => chassis.startsWith("7705 SAR") || chassis.startsWith("SAR-"),
  "7750DMS": chassis => chassis.startsWith("DMS-"),
  "7750SR": chassis => chassis.startsWith("SR-"),
  "7950XRS": chassis => chassis.startsWith("XRS-"),
  "VSR": chassis => chassis.startsWith("VSR-"),
  "7210SAS": () => false,
  "SR Linux": () => false,
  "Linux": () => false,
};

function optionsForPlatform(platform, key) {
  const matches = PLATFORM_CHASSIS_MATCHERS[platform];
  if (!matches) return ["None"];
  const values = Object.entries(HARDWARE_DB.chassis)
    .filter(([chassis]) => matches(chassis))
    .flatMap(([, hardware]) => hardware[key] || [])
    .filter(v => v && v !== "None");
  return ["None", ...Array.from(new Set(values)).sort((a, b) => a.localeCompare(b))];
}

function chassisOptionsForPlatform(platform) {
  const matches = PLATFORM_CHASSIS_MATCHERS[platform];
  if (!matches) return ["None"];
  const values = Object.keys(HARDWARE_DB.chassis).filter(matches);
  return ["None", ...values.sort((a, b) => a.localeCompare(b))];
}

function hardwareOptionsForPlatform(platform) {
  return {
    sfmCpmTypes: optionsForPlatform(platform, "sfmCpmTypes"),
    iomCardTypes: optionsForPlatform(platform, "iomCardTypes"),
    mdaTypes: optionsForPlatform(platform, "mdaTypes"),
  };
}

function hardwareOptionsForNode(node) {
  if (node.chassisModel && node.chassisModel !== "None" && HARDWARE_DB.chassis[node.chassisModel]) {
    return HARDWARE_DB.chassis[node.chassisModel];
  }
  return hardwareOptionsForPlatform(node.type);
}

// A selected chassis is "integrated" (fixed pizza-box) when its DB entry has no
// line card — those models can't take CPM/SFM modules or separate IOMs.
// Platform-only (no chassis chosen) returns false so controls stay unlocked.
function chassisIsIntegrated(node) {
  const model = (node.chassisModel && node.chassisModel !== "None") ? node.chassisModel : null;
  const hw = model ? HARDWARE_DB.chassis[model] : null;
  if (!hw) return false;
  return !(hw.iomCardTypes || []).some(v => v && v !== "None");
}

// Breakout-capable connector families named in an MDA type (e.g. "…qsfp28").
function connectorFamilies(mdaType) {
  const s = String(mdaType || "").toLowerCase();
  const fam = [];
  if (/qsfp-?dd/.test(s)) fam.push("qsfpdd");
  if (/qsfp28/.test(s)) fam.push("qsfp28");
  if (/qsfp\+/.test(s)) fam.push("qsfp+");
  if (/cfp8/.test(s)) fam.push("cfp8");
  if (/cfp2/.test(s)) fam.push("cfp2");
  return fam;
}

// Breakout choices valid for an MDA type. Unknown/None -> full list (permissive);
// an MDA with no breakout-capable connector -> ["None"].
function breakoutOptionsFor(mdaType) {
  if (!mdaType || mdaType === "None") return BREAKOUT_OPTIONS;
  const fams = connectorFamilies(mdaType);
  if (!fams.length) return ["None"];
  const out = [];
  fams.forEach(f => (CONNECTOR_BREAKOUTS[f] || []).forEach(b => { if (!out.includes(b)) out.push(b); }));
  return ["None", ...out];
}

// Resolve the MDA type serving a port id (card slot + mda slot before the cX connector).
function mdaTypeForPort(node, portName) {
  const parts = String(portName || "").split("/");
  const ci = parts.findIndex(p => /^c\d+$/.test(p));
  if (ci < 1) return null;
  const card = (node.cards || []).find(c => String(c.slot) === String(parts[0]));
  if (!card) return null;
  const mda = (card.mdas || []).find(m => String(m.slot) === String(parts[ci - 1]));
  return mda ? mda.type : null;
}

      placeholder={placeholder}
      onFocus={() => setFocus(true)}
      onBlur={() => setFocus(false)}
      style={{
        background: focus ? "#3c3c3c" : "#3c3c3c",
        border: `1px solid ${focus ? G.accent : "#6a6a6a"}`,
        borderRadius: 2, color: G.textPrimary,
        padding: "6px 10px", fontSize: 13, width: "100%",
        fontFamily: mono ? "'JetBrains Mono',monospace" : "'Segoe UI',sans-serif",
        outline: "none", transition: "all .15s",
        ...style,
      }}
    />
  );
}

function Select({ value, onChange, options, style = {} }) {
  const [focus, setFocus] = useState(false);
  return (
    <select
      value={value}
      onChange={e => onChange(e.target.value)}
      onFocus={() => setFocus(true)}
      onBlur={() => setFocus(false)}
      style={{
        background: "#3c3c3c",
        border: `1px solid ${focus ? G.accent : "#6a6a6a"}`,
        borderRadius: 2, color: G.textPrimary,
        padding: "6px 10px", fontSize: 13, width: "100%",
        fontFamily: "'Segoe UI',sans-serif",
        outline: "none", transition: "all .15s", cursor: "pointer",
        ...style,
      }}
    >
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}

function Toggle({ value, onChange, label }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => onChange(!value)}>
      <div style={{
        width: 36, height: 20, borderRadius: 10,
        background: value ? G.accent : G.border,
        position: "relative", transition: "all .25s",
        boxShadow: value ? `0 0 10px ${G.accent}66` : "none",
      }}>
        <div style={{
          width: 14, height: 14, borderRadius: 7, background: "#fff",
          position: "absolute", top: 3, left: value ? 18 : 3,
          transition: "all .25s", boxShadow: "0 1px 4px #0008",
        }} />
      </div>
      <span style={{ fontSize: 12, color: value ? G.textPrimary : G.textSecondary }}>{label}</span>
    </div>
  );
}

function Btn({ onClick, children, variant = "primary", disabled, style = {} }) {
  const [hov, setHov] = useState(false);
  const colors = {
    primary: G.accent, success: G.success, danger: G.error, ghost: G.border,
  };
  const c = colors[variant] || G.accent;
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: hov && !disabled ? c : (variant === 'ghost' ? 'transparent' : c + '22'),
        border: `1px solid ${disabled ? G.textMuted : c}`,
        color: disabled ? G.textMuted : (hov && variant !== 'ghost' ? '#fff' : c),
        borderRadius: 2, padding: "6px 14px", fontSize: 12, cursor: disabled ? "not-allowed" : "pointer",
        fontFamily: "'Segoe UI',sans-serif", fontWeight: 500,
        transition: "all .15s",
        ...style,
      }}
    >{children}</button>
  );
}

function CodeBlock({ code, filename }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard.writeText(code);
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };
  return (
    <div style={{ borderRadius: 0, overflow: "hidden", border: `1px solid ${G.border}`, marginBottom: 12, animation: "fadeIn .3s ease" }}>
      <div style={{ background: G.card, padding: "6px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${G.border}` }}>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: G.textSecondary }}>{filename}</span>
        <Btn onClick={copy} variant={copied ? "success" : "ghost"} style={{ padding: "3px 10px", fontSize: 11 }}>
          {copied ? "✓ COPIED" : "COPY"}
        </Btn>
      </div>
      <pre style={{
        background: "#1e1e1e", padding: 16, overflowX: "auto",
        fontFamily: "'JetBrains Mono',monospace", fontSize: 11.5,
        color: "#d4d4d4", lineHeight: 1.6, maxHeight: 360,
        whiteSpace: "pre", margin: 0,
      }}>{code}</pre>
    </div>
  );
}

function Spinner() {
  return (
    <div style={{ width: 18, height: 18, border: `2px solid ${G.border}`, borderTopColor: G.accent, borderRadius: "50%", animation: "spin .7s linear infinite", display: "inline-block" }} />
  );
}

// ─── Node Editor ─────────────────────────────────────────────────────────────
function NodeEditor({ node, onChange, onDelete, index }) {
  const [open, setOpen] = useState(index === 0);
  const upd = (k, v) => onChange({ ...node, [k]: v });
  const chassisOptions = chassisOptionsForPlatform(node.type);
  const hardwareOptions = hardwareOptionsForNode(node);
  const integrated = chassisIsIntegrated(node);
  // Changing platform/chassis invalidates prior card selections -> reset to a clean default.
  const setPlatform = (type) => onChange({ ...node, type, chassisModel: "None", cpms: [], cards: defaultCards() });
  const setChassisModel = (chassisModel) => onChange({ ...node, chassisModel, cpms: [], cards: defaultCards() });

  const updIface = (i, k, v) => {
    const ifaces = [...node.interfaces];
    ifaces[i] = { ...ifaces[i], [k]: v };
    upd("interfaces", ifaces);
  };
  const addIface = () => upd("interfaces", [...node.interfaces, { name: "", ip: "", role: "network", breakout: "None", ifaceName: "" }]);
  const delIface = (i) => upd("interfaces", node.interfaces.filter((_, j) => j !== i));

  // ── CPM/SFM module handlers ──
  const cpms = node.cpms || [];
  const cpmSlots = ["A", "B", "C", "D"];
  const addCpm = () => upd("cpms", [...cpms, { slot: cpmSlots[cpms.length] || String(cpms.length + 1), type: "None" }]);
  const updCpm = (i, k, v) => upd("cpms", cpms.map((c, j) => j === i ? { ...c, [k]: v } : c));
  const delCpm = (i) => upd("cpms", cpms.filter((_, j) => j !== i));

  // ── Line-card + MDA handlers ──
  const cards = node.cards || [];
  const addCard = () => upd("cards", [...cards, { slot: String(cards.length + 1), type: "None", mdas: [{ slot: "1", type: "None" }] }]);
  const updCard = (i, k, v) => upd("cards", cards.map((c, j) => j === i ? { ...c, [k]: v } : c));
  const delCard = (i) => upd("cards", cards.filter((_, j) => j !== i));
  const addMda = (ci) => upd("cards", cards.map((c, j) => j === ci ? { ...c, mdas: [...(c.mdas || []), { slot: String((c.mdas || []).length + 1), type: "None" }] } : c));
  const updMda = (ci, mi, k, v) => upd("cards", cards.map((c, j) => j === ci ? { ...c, mdas: c.mdas.map((m, mj) => mj === mi ? { ...m, [k]: v } : m) } : c));

              <Label>System IP / Loopback</Label>

                <Toggle value={node.includeSystem !== false} onChange={v => upd("includeSystem", v)} label="Include system interface" />

          </div>

// ─── Deterministic config engine ──────────────────────────────────────────────
// Builds SR OS 25.10.R3 classic-CLI .sros.cfg files and a Containerlab
// nokia_srsim .clab.yml. Output is chassis-dependent:
//   * clab: integrated chassis -> single node w/ env overrides; distributed
//     chassis -> grouped `components:` list (CPM slots + line-card slot).
//   * SR OS: a "Card Configuration" block provisions sfm/card/mda from the
//     selected hardware types (required because a full startup-config must
//     provision its own cards).

// Chassis that ship redundant CPMs -> emit slot B in the clab components list.
const DUAL_CPM_CHASSIS = new Set([
  "SR-7", "SR-7s", "SR-12", "SR-12e", "SR-14s",
  "SR-2s", "SR-2se", "XRS-20XRS-20e", "ESS-7", "ESS-12",
  "IXR-6", "IXR-10",
]);

function ipNoMask(ip) { return String(ip || "").split("/")[0].trim(); }

// Router-id -> IS-IS system-id, e.g. 10.0.0.1 -> 0100.0000.0001
function systemIdFromIp(ip) {
  const octs = (ipNoMask(ip) || "0.0.0.0").split(".")
    .map(o => String(parseInt(o || "0", 10) || 0).padStart(3, "0"));
  while (octs.length < 4) octs.push("000");
  const d = octs.slice(0, 4).join("");
  return `${d.slice(0, 4)}.${d.slice(4, 8)}.${d.slice(8, 12)}`;
}

function chassisModelOf(node) {
  return (node.chassisModel && node.chassisModel !== "None") ? node.chassisModel : null;
}

// clab `type:` value (lowercased chassis or platform), e.g. SR-1 -> sr-1
function clabTypeOf(node) {
  const base = chassisModelOf(node) || node.type;
  return String(base).toLowerCase().replace(/_/g, "-");
}

// Containerlab node kind from the platform type. SR OS platforms -> nokia_srsim;
// "Linux" -> linux; "SR Linux" -> nokia_srlinux.
function clabKindOf(node) {
  const t = String(node.type || "");
  if (t === "Linux") return "linux";
  if (t === "SR Linux" || t === "SRLinux") return "nokia_srlinux";
  return "nokia_srsim";
}

function pick(v) { return (v && v !== "None") ? v : null; }

// Configured CPM/SFM modules (type selected) and line cards (own type or any MDA type).
function nodeCpms(node) { return (node.cpms || []).filter(c => pick(c.type)); }
function nodeCards(node) {
  return (node.cards || []).filter(c => pick(c.type) || (c.mdas || []).some(m => pick(m.type)));
}
// A CPM occupies an alpha slot (A/B); an SFM occupies a numeric slot.
function isCpmSlot(slot) { return /^[A-Za-z]/.test(String(slot || "")); }

// Faceplate connector for a port name, e.g. 1/1/c1/1 -> 1/1/c1, 1/x2/3/c4/5 -> 1/x2/3/c4.
function connectorOf(name) {
  const parts = String(name || "").split("/");
  const idx = parts.findIndex(p => /^c\d+$/.test(p));
  return idx === -1 ? null : parts.slice(0, idx + 1).join("/");
}

// A node is "distributed" (chassis-based, needs CPM/line-card slots) when its
// chassis takes a separate IOM/line-card in the hardware DB, or the user added a
// CPM/SFM module or a line card with a card-type. Otherwise it is an integrated
// pizza-box.
function isDistributedNode(node) {
  const model = chassisModelOf(node);
  const hw = model ? HARDWARE_DB.chassis[model] : null;
  const dbHasIom = hw && (hw.iomCardTypes || []).some(v => v && v !== "None");
  const userCard = (node.cards || []).some(c => pick(c.type));
  const userCpm = (node.cpms || []).some(c => pick(c.type));
  return Boolean(dbHasIom || userCard || userCpm);
}

// ── SR OS classic-CLI section builders ────────────────────────────────────────
function srosCardConfig(node) {
  const cpms = nodeCpms(node);
  const cards = nodeCards(node);
  if (!cpms.length && !cards.length) return null; // rely on containerlab defaults
  const L = ["#--------------------------------------------------",
    'echo "Card Configuration"',
    "#--------------------------------------------------"];
  // CPM (card A/B) and SFM (sfm N) modules.
  cpms.forEach(c => {
    if (isCpmSlot(c.slot)) {
      L.push(`    card ${c.slot}`, `        card-type ${c.type}`, "        no shutdown", "    exit");
    } else {
      L.push(`    sfm ${c.slot}`, `        sfm-type ${c.type}`, "        no shutdown", "    exit");
    }
  });
  // Line cards with their MDAs.
  cards.forEach(card => {
    L.push(`    card ${card.slot}`);
    if (pick(card.type)) L.push(`        card-type ${card.type}`);
    (card.mdas || []).filter(m => pick(m.type)).forEach(m => {
      L.push(`        mda ${m.slot}`, `            mda-type ${m.type}`, "            no shutdown", "        exit");
    });
    L.push("        no shutdown", "    exit");
  });
  return L.join("\n");
}

function srosSystem(node) {
  return [
    "#--------------------------------------------------",
    'echo "System Configuration"',
    "#--------------------------------------------------",
    "    system",
    `        name "${node.name}"`,
    "        dns",
    "            address-pref ipv4-first",
    "        exit",
    "        snmp",
    "            packet-size 9216",
    "        exit",
    "    exit",
  ].join("\n");
}

// Logical SR OS interface name (user-provided) with fallback to the port id.
function ifName(i) { return pick(i.ifaceName) || i.name; }

// The whole router-base section is emitted under ONE `router Base` context:
// router-id/AS + interfaces, then IGP, MPLS/LDP/RSVP, and BGP as inner blocks.
function srosRouterBaseInner(node) {
  const L = [`        router-id ${ipNoMask(node.systemIp)}`];
  if (pick(node.asn)) L.push(`        autonomous-system ${node.asn}`);
  if (node.includeSystem !== false) {
    L.push('        interface "system"', `            address ${node.systemIp}`,
      "            loopback", "            no shutdown", "        exit");
  }
  (node.interfaces || []).filter(i => i.name).forEach(i => {
    L.push(`        interface "${ifName(i)}"`);
    if (i.ip) L.push(`            address ${i.ip}`);
    L.push(`            port ${i.name}`, "            no shutdown", "        exit");
  });
  return L.join("\n");
}

function srosIgpInner(node) {
  const ifaces = (node.interfaces || []).filter(i => i.name);
  const sys = node.includeSystem !== false;
  if (node.igp === "OSPF") {
    const L = ["        ospf 0", `            router-id ${ipNoMask(node.systemIp)}`,
      `            area ${node.ospfArea || "0.0.0.0"}`];
    if (sys) L.push('                interface "system"', "                    no shutdown", "                exit");
    ifaces.forEach(i => L.push(`                interface "${ifName(i)}"`,
      "                    interface-type point-to-point", "                    no shutdown", "                exit"));
    L.push("            exit", "            no shutdown", "        exit");
    return L.join("\n");
  }
  if (node.igp === "ISIS") {
    const L = ["        isis 0", `            level-capability level-${node.isisLevel || "2"}`,
      `            system-id ${systemIdFromIp(node.systemIp)}`, `            area-address ${node.isisArea || "49.0001"}`];
    if (sys) L.push('            interface "system"', "                passive", "                no shutdown", "            exit");
    ifaces.forEach(i => L.push(`            interface "${ifName(i)}"`,
      "                interface-type point-to-point", "                no shutdown", "            exit"));
    L.push("            no shutdown", "        exit");
    return L.join("\n");
  }
  return null;
}

function srosMplsLdpInner(node) {
  if (!node.ldpEnabled && !node.rsvpEnabled) return null;
  const ifaces = (node.interfaces || []).filter(i => i.name);
  const sys = node.includeSystem !== false;
  const L = ["        mpls"];
  if (sys) L.push('            interface "system"', "                no shutdown", "            exit");
  ifaces.forEach(i => L.push(`            interface "${ifName(i)}"`, "                no shutdown", "            exit"));
  if (node.rsvpEnabled) {
    if (pick(node.pathName)) L.push(`            path "${node.pathName}"`, "                no shutdown", "            exit");
    if (pick(node.lspId)) {
      L.push(`            lsp "${node.lspId}"`);
      if (pick(node.farEndIp)) L.push(`                to ${node.farEndIp}`);
      if (pick(node.pathName)) L.push(`                primary "${node.pathName}"`, "                exit");
      L.push("                no shutdown", "            exit");
    }
  }
  L.push("            no shutdown", "        exit");
  if (node.rsvpEnabled) {
    L.push("        rsvp");
    if (sys) L.push('            interface "system"', "                no shutdown", "            exit");
    ifaces.forEach(i => L.push(`            interface "${ifName(i)}"`, "                no shutdown", "            exit"));
    L.push("            no shutdown", "        exit");
  }
  if (node.ldpEnabled) {
    L.push("        ldp", "            interface-parameters");
    if (sys) L.push('                interface "system"', "                    ipv4",
      "                        no shutdown", "                    exit", "                exit");
    ifaces.forEach(i => L.push(`                interface "${ifName(i)}"`, "                    ipv4",
      "                        no shutdown", "                    exit", "                exit"));
    L.push("            exit", "            no shutdown", "        exit");
  }
  return L.join("\n");
}

function srosBgpInner(node) {
  if (!pick(node.bgpRole) || node.bgpRole === "None") return null;
  const isRR = node.bgpRole === "IBGP Route Reflector";
  const isEbgp = node.bgpRole === "EBGP Peer";
  const group = isEbgp ? "ebgp" : "ibgp";
  const L = ["        bgp", "            rapid-withdrawal", `            group "${group}"`,
    "                family ipv4 vpn-ipv4 ipv6 vpn-ipv6 evpn",
    `                type ${isEbgp ? "external" : "internal"}`,
    `                peer-as ${node.asn || "65000"}`];
  if (isRR && pick(node.clusterId)) L.push(`                cluster ${node.clusterId}`);
  if (pick(node.neighborIp)) L.push(`                neighbor ${node.neighborIp}`, "                    no shutdown", "                exit");
  L.push("            exit", "            no shutdown", "        exit");
  return L.join("\n");
}

// Single router Base section wrapping router-id/AS, interfaces, IGP, MPLS and BGP.
function srosRouterSection(node) {
  const inner = [srosRouterBaseInner(node), srosIgpInner(node), srosMplsLdpInner(node), srosBgpInner(node)]
    .filter(Boolean).join("\n");
  return ["#--------------------------------------------------",
    'echo "Router (Network Side) Configuration"',
    "#--------------------------------------------------",
    "    router Base", inner, "    exit"].join("\n");
}

// Connector breakouts get their own section and are enabled with `no shutdown`.
function srosConnectors(node) {
  const ifaces = (node.interfaces || []).filter(i => i.name);
  const done = {};
  const L = [];
  ifaces.forEach(i => {
    const bo = pick(i.breakout);
    const conn = connectorOf(i.name);
    if (!bo || !conn || done[conn]) return;
    done[conn] = true;
    L.push(`    port ${conn}`, "        connector", `            breakout ${bo}`, "        exit",
      "        no shutdown", "    exit");
  });
  if (!L.length) return null;
  return ["#--------------------------------------------------", 'echo "Connector Configuration"',
    "#--------------------------------------------------", ...L].join("\n");
}

function srosService(node) {
  const svc = pick(node.service);
  if (!svc) return null;
  const rd = pick(node.rdRt) || `${ipNoMask(node.systemIp)}:1`;
  const cust = pick(node.customerId) || "1";
  const L = ["#--------------------------------------------------", 'echo "Service Configuration"',
    "#--------------------------------------------------", "    service",
    `        customer ${cust} name "${cust}" create`,
    '            description "Default customer"', "        exit"];
  if (svc === "VPRN" || svc === "L3VPN" || svc === "IES") {
    if (svc === "IES") {
      L.push(`        ies 1 name "${node.name}-ies" customer ${cust} create`, "            no shutdown", "        exit");
    } else {
      L.push(`        vprn 1 name "${node.name}-vprn" customer ${cust} create`,
        `            route-distinguisher ${rd}`, "            auto-bind-tunnel",
        "                resolution any", "            exit",
        `            vrf-target target:${rd}`,
        `            autonomous-system ${node.asn || "65000"}`, "            no shutdown", "        exit");
    }
  } else if (svc === "VPLS" || svc === "EVPN-VXLAN") {
    L.push(`        vpls 1 name "${node.name}-vpls" customer ${cust} create`);
    if (svc === "EVPN-VXLAN") {
      L.push("            vxlan instance 1 vni 1 create", "            exit",
        "            bgp", "            exit", "            bgp-evpn",
        "                evi 1", "                vxlan bgp 1 vxlan-instance 1", "                    no shutdown",
        "                exit", "            exit");
    }
    L.push("            no shutdown", "        exit");
  } else if (svc === "Epipe" || svc === "EVPN-VPWS") {
    L.push(`        epipe 1 name "${node.name}-epipe" customer ${cust} create`);
    if (svc === "EVPN-VPWS") {
      L.push("            bgp", "            exit", "            bgp-evpn",
        "                local-attachment-circuit \"ac1\" create", "                exit",
        "                remote-attachment-circuit \"ac2\" create", "                exit", "            exit");
    }
    L.push("            no shutdown", "        exit");
  }
  L.push("    exit");
  return L.join("\n");
}

function srosPorts(node) {
  const ifaces = (node.interfaces || []).filter(i => i.name);
  if (!ifaces.length) return null;
  const L = ["#--------------------------------------------------", 'echo "Port Configuration"',
    "#--------------------------------------------------"];
  ifaces.forEach(i => {
    L.push(`    port ${i.name}`);
    if (i.role === "access" || i.role === "hybrid") {
      L.push("        ethernet", `            mode ${i.role}`, "            encap-type dot1q", "        exit");
    }
    L.push("        no shutdown", "    exit");
  });
  return L.join("\n");
}

function buildSrosConfig(node, global) {
  const ver = (global.srosVersion || "25.10.R3");
  const now = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
  // ver "25.10.R3" -> major "2510", release "R3" -> build path "2510B/R3"
  const [maj, rel] = [ver.replace(/\./g, "").replace(/R.*/, ""), (ver.match(/R\d+/) || ["R1"])[0]];
  const parts = [];
  parts.push([
    `# TiMOS-B-${ver} both/x86_64 Nokia 7750 SR Copyright (c) 2000-2026 Nokia.`,
    "# All rights reserved. All use subject to applicable license agreements.",
    `# Built on Wed Feb 11 21:15:49 UTC 2026 by builder in /builds/${maj}B/${rel}/panos`,
    `# Configuration format version ${ver.slice(0, 5)} revision 0`,
    "",
    `# Generated ${now}`,
    "",
    "exit all",
    "configure",
  ].join("\n"));
  [srosSystem(node), srosCardConfig(node), srosConnectors(node), srosPorts(node),
   srosRouterSection(node), srosService(node)]
    .filter(Boolean).forEach(s => parts.push(s));
  parts.push(["exit all", "", `# Finished ${now}`].join("\n"));
  return parts.join("\n");
}

// ── Containerlab .clab.yml ────────────────────────────────────────────────────
function buildClabNodeBlock(node) {
  const kind = clabKindOf(node);
  // Non-SR OS kinds: simple blocks, image inherited from topology.kinds.
  if (kind === "linux") {
    return [`    ${node.name}:`, "      kind: linux", "      cap-add:", "        - NET_ADMIN"].join("\n");
  }
  if (kind === "nokia_srlinux") {
    const L = [`    ${node.name}:`, "      kind: nokia_srlinux"];
    const t = chassisModelOf(node);
    if (t) L.push(`      type: ${String(t).toLowerCase().replace(/_/g, "-")}`);
    return L.join("\n");
  }
  const type = clabTypeOf(node);
  const cpms = nodeCpms(node);
  const cards = nodeCards(node);
  // SFM type (numeric-slot or *sfm* module) is passed to line cards via env.
  const sfmType = (cpms.find(c => /sfm/i.test(c.type)) ||
                   cpms.find(c => !isCpmSlot(c.slot)) || {}).type || null;
  const L = [`    ${node.name}:`, "      kind: nokia_srsim", `      type: ${type}`,
    `      startup-config: ${node.name}.sros.cfg`];
  if (isDistributedNode(node)) {
    L.push("      components:");
    // CPM components (alpha slots). Fall back to A(/B) when none specified.
    const cpmSlots = cpms.filter(c => isCpmSlot(c.slot)).map(c => c.slot);
    if (cpmSlots.length) {
      cpmSlots.forEach(s => L.push(`        - slot: ${s}`));
    } else {
      L.push("        - slot: A");
      if (DUAL_CPM_CHASSIS.has(chassisModelOf(node))) L.push("        - slot: B");
    }
    // Line-card components. Fall back to a single slot 1 when none specified.
    const lineCards = cards.length ? cards : [{ slot: "1", type: "None", mdas: [] }];
    lineCards.forEach(card => {
      L.push(`        - slot: ${card.slot}`);
      if (pick(card.type)) L.push(`          type: ${card.type}`);
      const mdas = (card.mdas || []).filter(m => pick(m.type));
      // Per containerlab docs: when overriding card/mda, SFM + MDA env must be set.
      if (sfmType || mdas.length) {
        L.push("          env:");
        if (sfmType) L.push(`            NOKIA_SROS_SFM: ${sfmType}`);
        mdas.forEach(m => L.push(`            NOKIA_SROS_MDA_${m.slot}: ${m.type}`));
      }
    });
  } else {
    // Integrated pizza-box: override each MDA via env var.
    const mdas = cards.flatMap(c => c.mdas || []).filter(m => pick(m.type));
    if (mdas.length) {
      L.push("      env:");
      mdas.forEach(m => L.push(`        NOKIA_SROS_MDA_${m.slot}: ${m.type}`));
    }
  }
  return L.join("\n");
}

function buildClabYaml(nodes, links, global) {
  const ver = global.srosVersion || "25.10.R3";
  const licensePath = (global.licensePath && global.licensePath.trim()) || "/opt/nokia/sros/license.txt";
  const validLinks = links.filter(l => l.nodeA && l.nodeB);
  const kinds = new Set(nodes.map(clabKindOf));
  const L = [`name: ${global.labName || "nokia-lab"}`, "", "topology:", "  kinds:"];
  if (kinds.has("nokia_srsim")) {
    L.push("    nokia_srsim:", `      image: nokia_srsim:${ver}`, `      license: ${licensePath}`);
  }
  if (kinds.has("nokia_srlinux")) {
    L.push("    nokia_srlinux:", "      image: ghcr.io/nokia/srlinux:latest");
  }
  if (kinds.has("linux")) {
    L.push("    linux:", "      image: ghcr.io/srl-labs/network-multitool:latest");
  }
  L.push("", "  nodes:");
  nodes.forEach(n => L.push(buildClabNodeBlock(n)));
  const ep = (node, iface) => `${String(node).trim()}:${String(iface || "").trim()}`;
  if (validLinks.length) {
    L.push("", "  links:");
    validLinks.forEach(l => L.push(`    - endpoints: [ "${ep(l.nodeA, l.ifaceA)}", "${ep(l.nodeB, l.ifaceB)}" ]`));
  } else {
    L.push("", "  links: []");
  }
  return L.join("\n");
}

// Top-level deterministic generator: returns { files:[{name,code}] }.
function generateConfigs(nodes, links, global) {
  // Only SR OS (nokia_srsim) nodes get a startup-config; linux/srlinux do not.
  const files = nodes.filter(n => clabKindOf(n) === "nokia_srsim")
    .map(n => ({ name: `${n.name}.sros.cfg`, code: buildSrosConfig(n, global) }));
  files.push({ name: `${(global.labName || "nokia-lab")}.clab.yml`, code: buildClabYaml(nodes, links, global) });
  return { files };
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("topology"); // topology | links | global | output
  const [nodes, setNodes] = useState([defaultNode(1), defaultNode(2)]);
  const [links, setLinks] = useState([defaultLink(1)]);
  const [global, setGlobal] = useState({ labName: "nokia-lab", srosVersion: "25.10.R3", ipPool: "10.0.0.0/8", licensePath: "/opt/nokia/sros/license.txt" });
  const [loading, setLoading] = useState(false);
  const [output, setOutput] = useState(null);
  const [error, setError] = useState(null);
  const [progress, setProgress] = useState("");
  const nodeId = useRef(3);
  const linkId = useRef(2);

  const addNode = () => { setNodes(p => [...p, defaultNode(nodeId.current++)]); };
  const delNode = (i) => setNodes(p => p.filter((_, j) => j !== i));
  const updNode = (i, n) => setNodes(p => p.map((x, j) => j === i ? n : x));
  const addLink = () => { setLinks(p => [...p, defaultLink(linkId.current++)]); };
  const delLink = (i) => setLinks(p => p.filter((_, j) => j !== i));
  const updLink = (i, l) => setLinks(p => p.map((x, j) => j === i ? l : x));

  const generate = () => {
    if (nodes.length === 0) return;
    setLoading(true);
    setError(null);
    setOutput(null);
    setTab("output");

    try {
      const { files } = generateConfigs(nodes, links, global);
      if (files.length === 0) throw new Error("Nothing to generate — add at least one node.");
      setOutput({ files });
      setProgress(`✓ ${files.length} files generated.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const saveBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };

  const downloadAll = async () => {
    if (!output) return;
    const zipName = `${(global.labName || "nokia-lab")}.zip`;
    if (typeof JSZip !== "undefined") {
      const zip = new JSZip();
      output.files.forEach(f => zip.file(f.name, f.code)); // all files at archive root
      const blob = await zip.generateAsync({ type: "blob" });
      saveBlob(blob, zipName);
    } else {
      // Fallback: individual downloads if JSZip failed to load.
      output.files.forEach(f => saveBlob(new Blob([f.code], { type: "text/plain" }), f.name));
    }
  };

  const TABS = [
    { id: "topology", label: "NODES", icon: "◈", count: nodes.length },
    { id: "links", label: "LINKS", icon: "⟷", count: links.filter(l => l.nodeA && l.nodeB).length },
    { id: "global", label: "GLOBAL", icon: "⚙", count: null },
    { id: "output", label: "OUTPUT", icon: "◉", count: output ? output.files.length : null },
  ];

  return (
    <div style={{ minHeight: "100vh", background: G.bg, display: "flex", flexDirection: "column" }}>
      <style>{css}</style>
      {/* Header */}
      <div style={{ background: G.panel, borderBottom: `1px solid ${G.border}`, padding: "14px 24px", display: "flex", alignItems: "center", gap: 16 }}>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 20, fontWeight: 700, color: G.accent, letterSpacing: 2 }}>
            ApexTopology
          </div>
          <div style={{ fontSize: 10, color: G.textMuted, letterSpacing: 2, fontFamily: "'JetBrains Mono',monospace" }}>Nokia SR OS Configuration Generator v0.9.10</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 10, alignItems: "center" }}>
          <Badge color={G.accent}>ContainerLAB</Badge>
          <Btn onClick={generate} disabled={loading || nodes.length === 0} variant="success" style={{ padding: "8px 20px", fontSize: 13, letterSpacing: 1.5 }}>
            {loading ? <span style={{ display: "flex", alignItems: "center", gap: 8 }}><Spinner /> GENERATING...</span> : "▶ GENERATE CONFIGS"}
          </Btn>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{ background: G.panel, borderBottom: `1px solid ${G.border}`, display: "flex", gap: 2, padding: "0 24px" }}>
        {TABS.map(t => (
          <div key={t.id} onClick={() => setTab(t.id)} style={{
            padding: "12px 20px", cursor: "pointer", fontSize: 12, fontFamily: "'JetBrains Mono',monospace",
            letterSpacing: 1.5, color: tab === t.id ? G.accent : G.textSecondary,
            borderBottom: tab === t.id ? `2px solid ${G.accent}` : "2px solid transparent",
            transition: "all .2s", display: "flex", alignItems: "center", gap: 8,
          }}>
            <span>{t.icon}</span>
            {t.label}
            {t.count !== null && <Badge color={tab === t.id ? G.accent : G.textMuted}>{t.count}</Badge>}
          </div>
        ))}
      </div>

      {/* Content */}
      <div style={{ flex: 1, padding: 24, overflowY: "auto" }}>
        {/* TOPOLOGY TAB */}
        {tab === "topology" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Node Configuration</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Define each router/node in your ContainerLAB topology</div>
              </div>
              <Btn onClick={addNode} variant="primary">+ ADD NODE</Btn>
            </div>
            {nodes.length === 0 && (
              <div style={{ textAlign: "center", padding: "60px 0", color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>◈</div>
                <div>No nodes. Add one to start.</div>
              </div>
            )}
            {nodes.map((n, i) => (
              <NodeEditor key={n.id} node={n} index={i} onChange={v => updNode(i, v)} onDelete={() => delNode(i)} />
            ))}
          </div>
        )}

        {/* LINKS TAB */}
        {tab === "links" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Links / Connections</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Define connections between nodes (se incluirán en el clab.yml)</div>
              </div>
              <Btn onClick={addLink} variant="primary">+ ADD LINK</Btn>
            </div>
            <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 16 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr auto", gap: 8, marginBottom: 10 }}>
                {["Node A", "Iface A", "Node B", "Iface B", "Type", ""].map((h, i) => (
                  <div key={i} style={{ fontSize: 10, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace", letterSpacing: 1.5 }}>{h}</div>
                ))}
              </div>
              {links.length === 0 && (
                <div style={{ textAlign: "center", padding: "30px 0", color: G.textMuted, fontFamily: "'JetBrains Mono',monospace", fontSize: 12 }}>
                  No hay links definidos.
                </div>
              )}
              {links.map((l, i) => (
                <LinkEditor key={l.id} link={l} nodes={nodes} onChange={v => updLink(i, v)} onDelete={() => delLink(i)} />
              ))}
            </div>
          </div>
        )}

        {/* GLOBAL TAB */}
        {tab === "global" && (
          <div style={{ animation: "fadeIn .2s ease", maxWidth: 640 }}>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Global Parameters</div>
              <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>General lab configuration</div>
            </div>
            <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 20, display: "grid", gap: 16 }}>
              <div><Label>Lab Name</Label><Input value={global.labName} onChange={v => setGlobal(p => ({ ...p, labName: v }))} placeholder="nokia-bng-lab" /></div>
              <div><Label>SR OS Version</Label>
                <Select value={global.srosVersion} onChange={v => setGlobal(p => ({ ...p, srosVersion: v }))} options={["23.3.R2", "23.7.R1", "23.10.R2", "24.3.R2", "24.7.R1", "24.10.R1", "25.3.R1", "25.7.R1", "25.10.R3"]} />
              </div>
              <div><Label>IP Pool</Label><Input value={global.ipPool} onChange={v => setGlobal(p => ({ ...p, ipPool: v }))} placeholder="10.0.0.0/8" mono /></div>
              <div><Label>SR OS License Path</Label><Input value={global.licensePath} onChange={v => setGlobal(p => ({ ...p, licensePath: v }))} placeholder="/opt/nokia/sros/license.txt" mono /></div>
            </div>
            <div style={{ marginTop: 16, background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 16 }}>
              <Label>Topology Summary</Label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginTop: 8 }}>
                {[
                  ["Nodes", nodes.length, G.accent],
                  ["Links", links.filter(l => l.nodeA && l.nodeB).length, G.accent2],
                  ["Services", nodes.filter(n => n.service !== "None").length, G.accent3],
                ].map(([label, val, color]) => (
                  <div key={label} style={{ textAlign: "center", background: G.panel, borderRadius: 8, padding: 16, border: `1px solid ${color}33` }}>
                    <div style={{ fontSize: 28, fontWeight: 800, color, fontFamily: "'JetBrains Mono',monospace" }}>{val}</div>
                    <div style={{ fontSize: 11, color: G.textMuted, letterSpacing: 1.5 }}>{label.toUpperCase()}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* OUTPUT TAB */}
        {tab === "output" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Generated Files</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>
                  {loading ? progress : output ? `${output.files.length} files ready` : "Press GENERATE CONFIGS to start"}
                </div>
              </div>
              {output && <Btn onClick={downloadAll} variant="success">↓ DOWNLOAD ZIP</Btn>}
            </div>

            {loading && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20, padding: "60px 0" }}>
                <div style={{ position: "relative", width: 80, height: 80 }}>
                  <div style={{ width: 80, height: 80, border: `3px solid ${G.border}`, borderTopColor: G.accent, borderRadius: "50%", animation: "spin .9s linear infinite" }} />
                  <div style={{ width: 56, height: 56, border: `3px solid ${G.border}`, borderTopColor: G.accent2, borderRadius: "50%", animation: "spin .6s linear infinite reverse", position: "absolute", top: 12, left: 12 }} />
                </div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", color: G.accent, fontSize: 13, textAlign: "center" }}>{progress}</div>
                <div style={{ fontSize: 11, color: G.textMuted, textAlign: "center" }}>Claude is generating complete SR OS configurations...</div>
              </div>
            )}

            {error && (
              <div style={{ background: G.error + "11", border: `1px solid ${G.error}44`, borderRadius: 10, padding: 20, display: "flex", gap: 12, alignItems: "flex-start" }}>
                <span style={{ color: G.error, fontSize: 20 }}>⚠</span>
                <div>
                  <div style={{ color: G.error, fontWeight: 600, marginBottom: 4 }}>Generation Error</div>
                  <div style={{ color: G.textSecondary, fontSize: 13, fontFamily: "'JetBrains Mono',monospace" }}>{error}</div>
                </div>
              </div>
            )}

            {output && !loading && (
              <div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                  {output.files.map(f => (
                    <Badge key={f.name} color={f.name.includes("clab") ? G.accent3 : G.accent}>{f.name}</Badge>
                  ))}
                </div>
                {output.files.map(f => (
                  <CodeBlock key={f.name} filename={f.name} code={f.code} />
                ))}
              </div>
            )}

            {!loading && !output && !error && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, padding: "60px 0", color: G.textMuted }}>
                <div style={{ fontSize: 48, opacity: .3 }}>◉</div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 13 }}>Configure nodes and press GENERATE CONFIGS</div>
                <div style={{ fontSize: 11, color: G.textMuted + "88", maxWidth: 400, textAlign: "center" }}>
                  The agent will generate .sros.cfg completos con IGP, BGP, LDP, RSVP-TE y servicios, más un snippet para tu clab.yml
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ background: G.panel, borderTop: `1px solid ${G.border}`, padding: "8px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 11, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>
          ApexTopology v0.9.10 · Nokia SR OS 25.10.R3 · Configuration Generator
        </span>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ width: 6, height: 6, borderRadius: "50%", background: G.accent2, animation: "pulse 2s infinite" }} />
          <span style={{ fontSize: 11, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>ONLINE</span>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
