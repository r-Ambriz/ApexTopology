const SFM_CPM_TYPES = HARDWARE_DB.sfmCpmTypes;
const IOM_TYPES = HARDWARE_DB.iomCardTypes;
const MDA_TYPES = HARDWARE_DB.mdaTypes;
const PLATFORM_CHASSIS_MATCHERS = {
  "7250IXR": chassis => chassis.startsWith("IXR-"),
  "7450ESS": chassis => chassis.startsWith("ESS-"),
  "7705SAR": chassis => chassis.startsWith("7705 SAR") || chassis.startsWith("SAR-"),
  "7750DMS": chassis => chassis.startsWith("DMS-"),
  "7750SR": chassis => chassis.startsWith("SR-"),
  "7950XRS": chassis => chassis.startsWith("XRS-"),
  "VSR": chassis => chassis.startsWith("VSR-"),
  "7210SAS": () => false,
  "Linux": () => false,
};

function optionsForPlatform(platform, key) {
  const matches = PLATFORM_CHASSIS_MATCHERS[platform];
  if (!matches) return ["None"];
  const values = Object.entries(HARDWARE_DB.chassis)
    .filter(([chassis]) => matches(chassis))
    .flatMap(([, hardware]) => hardware[key] || [])
    .filter(v => v && v !== "None");
  return ["None", ...Array.from(new Set(values)).sort((a, b) => a.localeCompare(b))];
}

function chassisOptionsForPlatform(platform) {
  const matches = PLATFORM_CHASSIS_MATCHERS[platform];
  if (!matches) return ["None"];
  const values = Object.keys(HARDWARE_DB.chassis).filter(matches);
  return ["None", ...values.sort((a, b) => a.localeCompare(b))];
}

function hardwareOptionsForPlatform(platform) {
  return {
    sfmCpmTypes: optionsForPlatform(platform, "sfmCpmTypes"),
    iomCardTypes: optionsForPlatform(platform, "iomCardTypes"),
    mdaTypes: optionsForPlatform(platform, "mdaTypes"),
  };
}

function hardwareOptionsForNode(node) {
  if (node.chassisModel && node.chassisModel !== "None" && HARDWARE_DB.chassis[node.chassisModel]) {
    return HARDWARE_DB.chassis[node.chassisModel];
  }
  return hardwareOptionsForPlatform(node.type);
}

function Badge({ color = G.accent, children }) {
  return (
    <span style={{
      background: color + "33", color, border: `1px solid ${color}88`,
      borderRadius: 2, padding: "2px 8px", fontSize: 11, fontFamily: "'JetBrains Mono',monospace",
      fontWeight: 500, letterSpacing: 0.5,
    }}>{children}</span>
  );
}

function Label({ children }) {
  return <div style={{ fontSize: 11, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace", letterSpacing: 1, marginBottom: 4, textTransform: "uppercase" }}>{children}</div>;
}

function Input({ value, onChange, placeholder, mono, style = {} }) {
  const [focus, setFocus] = useState(false);
  return (
    <input
      value={value}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
      onFocus={() => setFocus(true)}
      onBlur={() => setFocus(false)}
      style={{
        background: focus ? "#3c3c3c" : "#3c3c3c",
        border: `1px solid ${focus ? G.accent : "#6a6a6a"}`,
        borderRadius: 2, color: G.textPrimary,
        padding: "6px 10px", fontSize: 13, width: "100%",
        fontFamily: mono ? "'JetBrains Mono',monospace" : "'Segoe UI',sans-serif",
        outline: "none", transition: "all .15s",
        ...style,
      }}
    />
  );
}

function Select({ value, onChange, options, style = {} }) {
  const [focus, setFocus] = useState(false);
  return (
    <select
      value={value}
      onChange={e => onChange(e.target.value)}
      onFocus={() => setFocus(true)}
      onBlur={() => setFocus(false)}
      style={{
        background: "#3c3c3c",
        border: `1px solid ${focus ? G.accent : "#6a6a6a"}`,
        borderRadius: 2, color: G.textPrimary,
        padding: "6px 10px", fontSize: 13, width: "100%",
        fontFamily: "'Segoe UI',sans-serif",
        outline: "none", transition: "all .15s", cursor: "pointer",
        ...style,
      }}
    >
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}

function Toggle({ value, onChange, label }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => onChange(!value)}>
      <div style={{
        width: 36, height: 20, borderRadius: 10,
        background: value ? G.accent : G.border,
        position: "relative", transition: "all .25s",
        boxShadow: value ? `0 0 10px ${G.accent}66` : "none",
      }}>
        <div style={{
          width: 14, height: 14, borderRadius: 7, background: "#fff",
          position: "absolute", top: 3, left: value ? 18 : 3,
          transition: "all .25s", boxShadow: "0 1px 4px #0008",
        }} />
      </div>
      <span style={{ fontSize: 12, color: value ? G.textPrimary : G.textSecondary }}>{label}</span>
    </div>
  );
}

function Btn({ onClick, children, variant = "primary", disabled, style = {} }) {
  const [hov, setHov] = useState(false);
  const colors = {
    primary: G.accent, success: G.success, danger: G.error, ghost: G.border,
  };
  const c = colors[variant] || G.accent;
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: hov && !disabled ? c : (variant === 'ghost' ? 'transparent' : c + '22'),
        border: `1px solid ${disabled ? G.textMuted : c}`,
        color: disabled ? G.textMuted : (hov && variant !== 'ghost' ? '#fff' : c),
        borderRadius: 2, padding: "6px 14px", fontSize: 12, cursor: disabled ? "not-allowed" : "pointer",
        fontFamily: "'Segoe UI',sans-serif", fontWeight: 500,
        transition: "all .15s",
        ...style,
      }}
    >{children}</button>
  );
}

function CodeBlock({ code, filename }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard.writeText(code);
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };
  return (
    <div style={{ borderRadius: 0, overflow: "hidden", border: `1px solid ${G.border}`, marginBottom: 12, animation: "fadeIn .3s ease" }}>

// ─── Node Editor ─────────────────────────────────────────────────────────────
function NodeEditor({ node, onChange, onDelete, index }) {
  const [open, setOpen] = useState(index === 0);
  const upd = (k, v) => onChange({ ...node, [k]: v });
  const chassisOptions = chassisOptionsForPlatform(node.type);
  const hardwareOptions = hardwareOptionsForNode(node);
  const setPlatform = (type) => {
    const nextHardwareOptions = hardwareOptionsForPlatform(type);
    onChange({
      ...node,
      type,
      chassisModel: "None",
      sfmCpmType: nextHardwareOptions.sfmCpmTypes.includes(node.sfmCpmType) ? node.sfmCpmType : "None",
      iomType: nextHardwareOptions.iomCardTypes.includes(node.iomType) ? node.iomType : "None",
      mdaType: nextHardwareOptions.mdaTypes.includes(node.mdaType) ? node.mdaType : "None",
    });
  };
  const setChassisModel = (chassisModel) => {
    const nextHardwareOptions = chassisModel !== "None" ? HARDWARE_DB.chassis[chassisModel] : hardwareOptionsForPlatform(node.type);
    onChange({
      ...node,
      chassisModel,
      sfmCpmType: nextHardwareOptions.sfmCpmTypes.includes(node.sfmCpmType) ? node.sfmCpmType : "None",
      iomType: nextHardwareOptions.iomCardTypes.includes(node.iomType) ? node.iomType : "None",
      mdaType: nextHardwareOptions.mdaTypes.includes(node.mdaType) ? node.mdaType : "None",
    });
  };
  const updIface = (i, k, v) => {
    const ifaces = [...node.interfaces];
    ifaces[i] = { ...ifaces[i], [k]: v };
    upd("interfaces", ifaces);
  };
  const addIface = () => upd("interfaces", [...node.interfaces, { name: "", ip: "", role: "network", peer: "" }]);
  const delIface = (i) => upd("interfaces", node.interfaces.filter((_, j) => j !== i));

  return (
    <div style={{ border: `1px solid ${open ? G.accent : G.border}`, borderRadius: 0, marginBottom: 8, overflow: "hidden", transition: "all .2s" }}>
      {/* Header */}
      <div
        onClick={() => setOpen(!open)}
        style={{ background: G.card, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}
      >
        <span style={{ color: open ? G.accent : G.textSecondary, fontSize: 12, transition: "all .15s" }}>{open ? "▼" : "▶"}</span>

        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 600, color: G.textPrimary, fontSize: 13 }}>{node.name}</span>
        <Badge color={G.success}>{node.systemIp}</Badge>
        <Badge color={node.igp === "None" ? G.textMuted : G.warning}>{node.igp}</Badge>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          <Btn onClick={e => { e.stopPropagation(); onDelete(); }} variant="danger" style={{ padding: "3px 10px", fontSize: 11 }}>✕</Btn>
        </div>
      </div>
      {/* Body */}
      {open && (
        <div style={{ background: G.panel, padding: 14, display: "grid", gap: 12, animation: "fadeIn .2s ease" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
            <div><Label>Node Name</Label><Input value={node.name} onChange={v => upd("name", v)} placeholder="BNG1" /></div>
            <div><Label>Platform Type</Label><Select value={node.type} onChange={setPlatform} options={NODE_TYPES} /></div>
            <div><Label>System IP / Loopback</Label><Input value={node.systemIp} onChange={v => upd("systemIp", v)} placeholder="10.0.0.1/32" mono /></div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
            <div><Label>Chassis Model</Label><Select value={chassisOptions.includes(node.chassisModel) ? node.chassisModel : "None"} onChange={setChassisModel} options={chassisOptions} /></div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
            <div><Label>SFM/CPM Type</Label><Select value={hardwareOptions.sfmCpmTypes.includes(node.sfmCpmType) ? node.sfmCpmType : "None"} onChange={v => upd("sfmCpmType", v)} options={hardwareOptions.sfmCpmTypes} /></div>
            <div><Label>IOM/Card Type</Label><Select value={hardwareOptions.iomCardTypes.includes(node.iomType) ? node.iomType : "None"} onChange={v => upd("iomType", v)} options={hardwareOptions.iomCardTypes} /></div>
            <div><Label>MDA Type</Label><Select value={hardwareOptions.mdaTypes.includes(node.mdaType) ? node.mdaType : "None"} onChange={v => upd("mdaType", v)} options={hardwareOptions.mdaTypes} /></div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>

                <Input value={iface.name} onChange={v => updIface(i, "name", v)} placeholder="1/1/c1/1" mono />
                <Input value={iface.ip} onChange={v => updIface(i, "ip", v)} placeholder="192.168.1.1/30" mono />
                <Select value={iface.role} onChange={v => updIface(i, "role", v)} options={["network", "hybrid", "access"]} />
                <Input value={iface.peer} onChange={v => updIface(i, "peer", v)} placeholder="Peer: BNG2" />
                <Btn onClick={() => delIface(i)} variant="danger" style={{ padding: "3px 10px", fontSize: 11 }}>✕</Btn>

            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
            <div><Label>Service</Label><Select value={node.service} onChange={v => upd("service", v)} options={SERVICE_TYPES} /></div>

        </div>
      )}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("topology"); // topology | links | global | output
  const [nodes, setNodes] = useState([defaultNode(1), defaultNode(2)]);
  const [links, setLinks] = useState([defaultLink(1)]);
  const [global, setGlobal] = useState({ labName: "nokia-lab", srosVersion: "25.10.R3", ipPool: "10.0.0.0/8" });
  const [loading, setLoading] = useState(false);
  const [output, setOutput] = useState(null);
  const [error, setError] = useState(null);
  const [progress, setProgress] = useState("");
  const nodeId = useRef(3);
  const linkId = useRef(2);

  const addNode = () => { setNodes(p => [...p, defaultNode(nodeId.current++)]); };
  const delNode = (i) => setNodes(p => p.filter((_, j) => j !== i));
  const updNode = (i, n) => setNodes(p => p.map((x, j) => j === i ? n : x));
  const addLink = () => { setLinks(p => [...p, defaultLink(linkId.current++)]); };
  const delLink = (i) => setLinks(p => p.filter((_, j) => j !== i));
  const updLink = (i, l) => setLinks(p => p.map((x, j) => j === i ? l : x));

  // Parse output into files
  const parseFiles = (text) => {
    const files = [];
    const regex = /=== FILE: (.+?) ===\n([\s\S]*?)=== END ===/g;
    let m;
    while ((m = regex.exec(text)) !== null) {
      files.push({ name: m[1].trim(), code: m[2].trim() });
    }
    return files;
  };

  const generate = async () => {
    if (nodes.length === 0) return;
    setLoading(true);
    setError(null);
    setOutput(null);
    setTab("output");
    setProgress("Starting AI generation...");

    try {
      const prompt = buildPrompt(nodes, links, global);
      setProgress(`Sending topology, ${links.filter(l=>l.nodeA&&l.nodeB).length} links) to API...`);

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 8000,
          messages: [{ role: "user", content: prompt }],
        }),
      });

      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      const data = await res.json();
      const text = data.content?.filter(b => b.type === "text").map(b => b.text).join("") || "";

      setProgress("Parsing generated files...");
      const files = parseFiles(text);
      if (files.length === 0) throw new Error("Failed to parse files. Unexpected model response.");

      setOutput({ files, raw: text });
      setProgress(`✓ ${files.length} files generated successfully.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const downloadAll = () => {
    if (!output) return;
    output.files.forEach(f => {
      const blob = new Blob([f.code], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = f.name; a.click();
      URL.revokeObjectURL(url);
    });
  };

  const TABS = [
    { id: "topology", label: "NODES", icon: "◈", count: nodes.length },
    { id: "links", label: "LINKS", icon: "⟷", count: links.filter(l => l.nodeA && l.nodeB).length },
    { id: "global", label: "GLOBAL", icon: "⚙", count: null },
    { id: "output", label: "OUTPUT", icon: "◉", count: output ? output.files.length : null },
  ];

  return (
    <div style={{ minHeight: "100vh", background: G.bg, display: "flex", flexDirection: "column" }}>
      <style>{css}</style>
      {/* Header */}
      <div style={{ background: G.panel, borderBottom: `1px solid ${G.border}`, padding: "14px 24px", display: "flex", alignItems: "center", gap: 16 }}>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 20, fontWeight: 700, color: G.accent, letterSpacing: 2 }}>
            ApexTopology
          </div>
          <div style={{ fontSize: 10, color: G.textMuted, letterSpacing: 2, fontFamily: "'JetBrains Mono',monospace" }}>Nokia SR OS Configuration Generator v0.2</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 10, alignItems: "center" }}>
          <Badge color={G.accent}>ContainerLAB</Badge>
          <Btn onClick={generate} disabled={loading || nodes.length === 0} variant="success" style={{ padding: "8px 20px", fontSize: 13, letterSpacing: 1.5 }}>
            {loading ? <span style={{ display: "flex", alignItems: "center", gap: 8 }}><Spinner /> GENERANDO...</span> : "▶ GENERATE CONFIGS"}
          </Btn>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{ background: G.panel, borderBottom: `1px solid ${G.border}`, display: "flex", gap: 2, padding: "0 24px" }}>
        {TABS.map(t => (
          <div key={t.id} onClick={() => setTab(t.id)} style={{
            padding: "12px 20px", cursor: "pointer", fontSize: 12, fontFamily: "'JetBrains Mono',monospace",
            letterSpacing: 1.5, color: tab === t.id ? G.accent : G.textSecondary,
            borderBottom: tab === t.id ? `2px solid ${G.accent}` : "2px solid transparent",
            transition: "all .2s", display: "flex", alignItems: "center", gap: 8,
          }}>
            <span>{t.icon}</span>
            {t.label}
            {t.count !== null && <Badge color={tab === t.id ? G.accent : G.textMuted}>{t.count}</Badge>}
          </div>
        ))}
      </div>

      {/* Content */}
      <div style={{ flex: 1, padding: 24, overflowY: "auto" }}>
        {/* TOPOLOGY TAB */}
        {tab === "topology" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Node Configuration</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Define each router/node in your ContainerLAB topology</div>
              </div>
              <Btn onClick={addNode} variant="primary">+ ADD NODE</Btn>
            </div>
            {nodes.length === 0 && (
              <div style={{ textAlign: "center", padding: "60px 0", color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>◈</div>
                <div>No nodes. Add one to start.</div>
              </div>
            )}
            {nodes.map((n, i) => (
              <NodeEditor key={n.id} node={n} index={i} onChange={v => updNode(i, v)} onDelete={() => delNode(i)} />
            ))}
          </div>
        )}

        {/* LINKS TAB */}
        {tab === "links" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Links / Connections</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>Define connections between nodes (se incluirán en el clab.yml)</div>
              </div>
              <Btn onClick={addLink} variant="primary">+ ADD LINK</Btn>
            </div>
            <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 16 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr auto", gap: 8, marginBottom: 10 }}>
                {["Node A", "Iface A", "Node B", "Iface B", "Type", ""].map((h, i) => (
                  <div key={i} style={{ fontSize: 10, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace", letterSpacing: 1.5 }}>{h}</div>
                ))}
              </div>
              {links.length === 0 && (
                <div style={{ textAlign: "center", padding: "30px 0", color: G.textMuted, fontFamily: "'JetBrains Mono',monospace", fontSize: 12 }}>
                  No hay links definidos.
                </div>
              )}
              {links.map((l, i) => (
                <LinkEditor key={l.id} link={l} nodes={nodes} onChange={v => updLink(i, v)} onDelete={() => delLink(i)} />
              ))}
            </div>
          </div>
        )}

        {/* GLOBAL TAB */}
        {tab === "global" && (
          <div style={{ animation: "fadeIn .2s ease", maxWidth: 640 }}>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Global Parameters</div>
              <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>General lab configuration</div>
            </div>
            <div style={{ background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 20, display: "grid", gap: 16 }}>
              <div><Label>Lab Name</Label><Input value={global.labName} onChange={v => setGlobal(p => ({ ...p, labName: v }))} placeholder="nokia-bng-lab" /></div>
              <div><Label>SR OS Version</Label>
                <Select value={global.srosVersion} onChange={v => setGlobal(p => ({ ...p, srosVersion: v }))} options={["23.3.R2", "23.7.R1", "23.10.R2", "24.3.R2", "24.7.R1", "24.10.R1", "25.3.R1", "25.7.R1", "25.10.R3"]} />
              </div>
              <div><Label>IP Pool</Label><Input value={global.ipPool} onChange={v => setGlobal(p => ({ ...p, ipPool: v }))} placeholder="10.0.0.0/8" mono /></div>
            </div>
            <div style={{ marginTop: 16, background: G.card, border: `1px solid ${G.border}`, borderRadius: 10, padding: 16 }}>
              <Label>Topology Summary</Label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginTop: 8 }}>
                {[
                  ["Nodes", nodes.length, G.accent],
                  ["Links", links.filter(l => l.nodeA && l.nodeB).length, G.accent2],
                  ["Services", nodes.filter(n => n.service !== "None").length, G.accent3],
                ].map(([label, val, color]) => (
                  <div key={label} style={{ textAlign: "center", background: G.panel, borderRadius: 8, padding: 16, border: `1px solid ${color}33` }}>
                    <div style={{ fontSize: 28, fontWeight: 800, color, fontFamily: "'JetBrains Mono',monospace" }}>{val}</div>
                    <div style={{ fontSize: 11, color: G.textMuted, letterSpacing: 1.5 }}>{label.toUpperCase()}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* OUTPUT TAB */}
        {tab === "output" && (
          <div style={{ animation: "fadeIn .2s ease" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 600, color: G.textPrimary }}>Generated Files</div>
                <div style={{ fontSize: 12, color: G.textSecondary, marginTop: 2 }}>
                  {loading ? progress : output ? `${output.files.length} files ready` : "Press GENERATE CONFIGS to start"}
                </div>
              </div>
              {output && <Btn onClick={downloadAll} variant="success">↓ DOWNLOAD ALL</Btn>}
            </div>

            {loading && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20, padding: "60px 0" }}>
                <div style={{ position: "relative", width: 80, height: 80 }}>
                  <div style={{ width: 80, height: 80, border: `3px solid ${G.border}`, borderTopColor: G.accent, borderRadius: "50%", animation: "spin .9s linear infinite" }} />
                  <div style={{ width: 56, height: 56, border: `3px solid ${G.border}`, borderTopColor: G.accent2, borderRadius: "50%", animation: "spin .6s linear infinite reverse", position: "absolute", top: 12, left: 12 }} />
                </div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", color: G.accent, fontSize: 13, textAlign: "center" }}>{progress}</div>
                <div style={{ fontSize: 11, color: G.textMuted, textAlign: "center" }}>Claude is generating complete SR OS configurations...</div>
              </div>
            )}

            {error && (
              <div style={{ background: G.error + "11", border: `1px solid ${G.error}44`, borderRadius: 10, padding: 20, display: "flex", gap: 12, alignItems: "flex-start" }}>
                <span style={{ color: G.error, fontSize: 20 }}>⚠</span>
                <div>
                  <div style={{ color: G.error, fontWeight: 600, marginBottom: 4 }}>Generation Error</div>
                  <div style={{ color: G.textSecondary, fontSize: 13, fontFamily: "'JetBrains Mono',monospace" }}>{error}</div>
                </div>
              </div>
            )}

            {output && !loading && (
              <div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                  {output.files.map(f => (
                    <Badge key={f.name} color={f.name.includes("clab") ? G.accent3 : G.accent}>{f.name}</Badge>
                  ))}
                </div>
                {output.files.map(f => (
                  <CodeBlock key={f.name} filename={f.name} code={f.code} />
                ))}
              </div>
            )}

            {!loading && !output && !error && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, padding: "60px 0", color: G.textMuted }}>
                <div style={{ fontSize: 48, opacity: .3 }}>◉</div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 13 }}>Configure nodes and press GENERATE CONFIGS</div>
                <div style={{ fontSize: 11, color: G.textMuted + "88", maxWidth: 400, textAlign: "center" }}>
                  The agent will generate .sros.cfg completos con IGP, BGP, LDP, RSVP-TE y servicios, más un snippet para tu clab.yml
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ background: G.panel, borderTop: `1px solid ${G.border}`, padding: "8px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 11, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>
          ApexTopology v0.2 · Nokia SR OS 25.10.R3 · Configuration Generator
        </span>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ width: 6, height: 6, borderRadius: "50%", background: G.accent2, animation: "pulse 2s infinite" }} />
          <span style={{ fontSize: 11, color: G.textMuted, fontFamily: "'JetBrains Mono',monospace" }}>ONLINE</span>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
